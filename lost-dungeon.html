      ctx.globalAlpha = clamp(a.life * 8, 0, .72);
      ctx.translate(a.x, a.y);
      ctx.rotate(a.angle);
      ctx.fillStyle = a.color;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, a.range, -a.arc, a.arc);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha *= .55;
      ctx.fillRect(a.range - 8, -4, 16, 8);
      ctx.restore();
    }

    function drawDrop(d) {
      const bob = Math.sin(now() * 9 + d.x) * 2;
      if (d.gear) {
        const near = state.nearbyGear === d;
        ctx.save();
        ctx.globalAlpha = near ? .55 : .28;
        ctx.fillStyle = d.gear.qualityColor;
        ctx.beginPath();
        ctx.arc(d.x, d.y + bob, near ? 26 : 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        drawPixelRect(d.x - 13, d.y - 10 + bob, 26, 20, "#151216");
        drawPixelRect(d.x - 11, d.y - 8 + bob, 22, 16, d.gear.outline || d.gear.qualityColor);
        drawPixelRect(d.x - 8, d.y - 5 + bob, 16, 10, d.gear.color);
        drawPixelRect(d.x - 2, d.y - 15 + bob, 4, 24, "#efe1bf");
        drawPixelRect(d.x - 11, d.y + 8 + bob, 22, 3, "#fff0c8");
        if (near) {
          ctx.font = "12px Microsoft YaHei, sans-serif";
          ctx.textAlign = "center";
          ctx.fillStyle = "#fff0c8";
          ctx.fillText("E 拾取 " + d.gear.name, d.x, d.y - 24 + bob);
        }
        ctx.restore();
        return;
      }
      drawPixelRect(d.x - 6, d.y - 6 + bob, 12, 12, "#d8a645");
      drawPixelRect(d.x - 2, d.y - 8 + bob, 4, 16, "#ffe07a");
    }

    function drawChest(c) {
      if (c.opened) return;
      const near = state.nearbyChest === c;
      const bob = Math.sin(now() * 5 + c.x) * 1.5;
      ctx.save();
      ctx.globalAlpha = .28;
      drawPixelRect(c.x - 18, c.y + 14, 36, 8, "#050506");
      ctx.globalAlpha = 1;
      drawPixelRect(c.x - 20, c.y - 12 + bob, 40, 26, "#5a321d");
      drawPixelRect(c.x - 18, c.y - 10 + bob, 36, 9, "#a96a2c");
      drawPixelRect(c.x - 20, c.y - 15 + bob, 40, 8, "#c78a37");
      drawPixelRect(c.x - 3, c.y - 2 + bob, 6, 9, near ? "#fff0c8" : "#ffd35d");
      drawPixelRect(c.x - 22, c.y - 14 + bob, 4, 28, "#2a1a16");
      drawPixelRect(c.x + 18, c.y - 14 + bob, 4, 28, "#2a1a16");
      if (near) {
        ctx.font = "12px Microsoft YaHei, sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "#fff0c8";
        ctx.fillText("E 开宝箱", c.x, c.y - 24 + bob);
      }
      ctx.restore();
    }

    function drawBomb(b) {
      const pulse = b.fuse > 0 ? Math.sin(now() * 26) : 0;
      ctx.save();
      ctx.globalAlpha = .35;
      drawPixelRect(b.x - 14, b.y + 13, 28, 7, "#050506");
      ctx.globalAlpha = 1;
      drawPixelRect(b.x - 13, b.y - 12, 26, 26, pulse > 0 ? "#5c1f1c" : "#1a1b21");
      drawPixelRect(b.x - 9, b.y - 8, 18, 18, "#2d303b");
      drawPixelRect(b.x + 2, b.y - 17, 12, 5, "#6a4b32");
      drawPixelRect(b.x + 12, b.y - 20, 5, 5, b.fuse > 0 ? "#ffdf5a" : "#ff8d4a");
      ctx.restore();
    }

    function drawCover(c) {
      const th = theme();
      ctx.save();
      ctx.globalAlpha = .35;
      drawPixelRect(c.x - c.w / 2 + 3, c.y + c.h / 2 - 2, c.w - 6, 8, "#050506");
      ctx.globalAlpha = 1;
      if (c.kind === "pillar") {
        drawPixelRect(c.x - c.w / 2, c.y - c.h / 2, c.w, c.h, th.wallTop);
        drawPixelRect(c.x - c.w / 2 + 5, c.y - c.h / 2 + 5, c.w - 10, c.h - 10, th.wall);
        drawPixelRect(c.x - c.w / 2, c.y - c.h / 2, c.w, 6, th.accent);
        drawPixelRect(c.x - c.w / 2, c.y + c.h / 2 - 6, c.w, 6, th.trim);
      } else {
        drawPixelRect(c.x - c.w / 2, c.y - c.h / 2, c.w, c.h, "#6b3d24");
        drawPixelRect(c.x - c.w / 2 + 4, c.y - c.h / 2 + 4, c.w - 8, c.h - 8, "#9a6330");
        drawPixelRect(c.x - c.w / 2, c.y - 3, c.w, 5, "#2b1b14");
        drawPixelRect(c.x - 3, c.y - c.h / 2, 6, c.h, "#2b1b14");
      }
      ctx.restore();
    }

    function drawSpike(s) {
      const rise = s.active ? 1 : .35 + Math.sin(now() * 5 + s.x) * .05;
      ctx.save();
      drawPixelRect(s.x - 20, s.y - 12, 40, 24, "#171316");
      drawPixelRect(s.x - 18, s.y - 10, 36, 20, s.active ? "#3a1d1d" : "#262027");
      for (let i = -2; i <= 2; i++) {
        const x = s.x + i * 8;
        const h = 8 + rise * 16;
        ctx.fillStyle = s.active ? "#d9d0aa" : "#6c6870";
        ctx.beginPath();
        ctx.moveTo(x - 4, s.y + 8);
        ctx.lineTo(x + 4, s.y + 8);
        ctx.lineTo(x, s.y + 8 - h);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function drawMiniMap(vw, vh) {
      const size = 136;
      const x0 = vw - size - 16;
      const y0 = 96;
      const sx = size / MAP_W;
      const sy = size / MAP_H;
      ctx.save();
      ctx.scale(state.scale, state.scale);
      ctx.globalAlpha = .82;
      drawPixelRect(x0 - 6, y0 - 6, size + 12, size + 12, "rgba(12,10,12,.82)");
      drawPixelRect(x0 - 6, y0 - 6, size + 12, 3, "#60442c");
      drawPixelRect(x0 - 6, y0 + size + 3, size + 12, 3, "#60442c");
      drawPixelRect(x0 - 6, y0 - 6, 3, size + 12, "#60442c");
      drawPixelRect(x0 + size + 3, y0 - 6, 3, size + 12, "#60442c");
      for (let y = 0; y < MAP_H; y++) {
        for (let x = 0; x < MAP_W; x++) {
          drawPixelRect(x0 + x * sx, y0 + y * sy, Math.ceil(sx), Math.ceil(sy), state.map[y][x] === 1 ? "#2a2024" : "#7a6751");
        }
      }
      drawPixelRect(x0 + state.exit.x / TILE * sx, y0 + state.exit.y / TILE * sy, 6, 6, state.exit.open ? "#ffd35d" : "#7b2626");
      for (const c of state.covers) drawPixelRect(x0 + c.x / TILE * sx, y0 + c.y / TILE * sy, 4, 4, "#9a6330");
      for (const s of state.spikes) drawPixelRect(x0 + s.x / TILE * sx, y0 + s.y / TILE * sy, 3, 3, s.active ? "#ff3b30" : "#d9d0aa");
      for (const e of state.enemies) drawPixelRect(x0 + e.x / TILE * sx, y0 + e.y / TILE * sy, e.boss ? 5 : 3, e.boss ? 5 : 3, e.boss ? "#ffce4f" : "#d84b45");
      drawPixelRect(x0 + state.player.x / TILE * sx - 1, y0 + state.player.y / TILE * sy - 1, 6, 6, "#6fb7ff");
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function updateUI() {
      const p = state.player;
      ui.hpFill.style.width = (p.hp / p.maxHp * 100) + "%";
      ui.spFill.style.width = (p.sp / p.maxSp * 100) + "%";
      ui.hpText.textContent = Math.ceil(p.hp) + "/" + p.maxHp;
      ui.spText.textContent = Math.floor(p.sp) + "/" + p.maxSp;
      ui.goldText.textContent = p.gold;
      ui.weaponText.textContent = currentGear().name;
      ui.levelText.textContent = state.level;
      ui.roomText.textContent = state.room;
      ui.enemyText.textContent = state.enemies.length;
      ui.ownedText.textContent = p.owned.size;
      ui.attrText.textContent = "暴击 " + Math.round(p.stats.crit * 100) + "% | 攻速 " + Math.round(p.stats.atkSpeed * 100) + "% | 移速 " + Math.round(p.stats.move * 100) + "% | 吸血 " + Math.round(p.stats.lifesteal * 100) + "% | 祝福 " + ((state.runStats && state.runStats.boons.length) || 0);
      ui.lockText.textContent = state.locked ? "封锁中" : "已开门";
      ui.saveText.textContent = state.nearbyGear ? ("按E拾取 " + state.nearbyGear.gear.name) : (state.savedFlash > 0 ? "已存档" : "自动存档");
      if (state.boss && !state.boss.dead) {
        ui.bossLine.classList.add("on");
        ui.bossFill.style.width = Math.max(0, state.boss.hp / state.boss.maxHp * 100) + "%";
      } else {
        ui.bossLine.classList.remove("on");
      }
    }

    function renderShop() {
      if (!state.shopStock.length) state.shopStock = WEAPONS.map(w => makeLoot(w.id));
      ui.shopGrid.innerHTML = "";
      for (let i = 0; i < WEAPONS.length; i++) {
        const w = WEAPONS[i];
        const owned = state.player.owned.has(w.id);
        const preview = state.shopStock[i] || makeLoot(w.id);
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = "<strong style='color:" + preview.qualityColor + "'>" + preview.name + "</strong><p>" + w.desc + "</p><p>伤害 " + preview.damage + " | 暴击 " + Math.round(preview.crit * 100) + "% | 吸血 " + Math.round(preview.lifesteal * 100) + "%</p>";
        const btn = document.createElement("button");
        btn.textContent = owned ? (state.player.weapon === w.id ? "买新词条 " + Math.max(30, w.cost) + "G" : "装备基础") : "购买 " + w.cost + "G";
        btn.disabled = !owned && state.player.gold < w.cost;
        btn.onclick = () => {
          if (!owned) {
            if (state.player.gold < w.cost) return;
            state.player.gold -= w.cost;
            state.player.owned.add(w.id);
          } else if (state.player.gold >= Math.max(30, w.cost)) {
            state.player.gold -= Math.max(30, w.cost);
          } else {
            return;
          }
          state.player.weapon = w.id;
          state.player.equipped = JSON.parse(JSON.stringify(preview));
          recalcStats();
          saveGame();
          state.shopStock[i] = makeLoot(w.id);
          renderShop();
        };
        div.appendChild(btn);
        ui.shopGrid.appendChild(div);
      }
    }

    function toggleShop(force) {
      if (state.phase !== "running" || state.gameOver || state.victory) return;
      state.shopOpen = typeof force === "boolean" ? force : !state.shopOpen;
      ui.shop.classList.toggle("on", state.shopOpen);
      if (state.shopOpen) {
        if (!state.shopStock.length) state.shopStock = WEAPONS.map(w => makeLoot(w.id));
        renderShop();
      }
    }

    function loop() {
      const t = now();
      const dt = Math.min(.033, t - state.lastTime);
      state.lastTime = t;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function reset() {
      state.level = 1;
      state.room = 1;
      state.phase = "running";
      state.gameOver = false;
      state.victory = false;
      state.difficulty = DIFFICULTIES.find(d => d.id === state.selectedDifficulty) || DIFFICULTIES[0];
      state.runStats = baseRunStats(state.selectedHero);
      state.player.maxHp = state.runStats.maxHp;
      state.player.maxSp = state.runStats.maxSp;
      state.player.hp = state.player.maxHp;
      state.player.sp = state.player.maxSp;
      state.player.gold = 0;
      state.player.weapon = state.selectedWeapon;
      state.player.owned = new Set(["sword", state.selectedWeapon]);
      state.player.equipped = makeLoot(state.selectedWeapon);
      recalcStats();
      localStorage.removeItem(SAVE_KEY);
      toggleShop(false);
      ui.menuScreen.classList.remove("on");
      ui.resultScreen.classList.remove("on");
      ui.boonScreen.classList.remove("on");
      spawnRoom();
      saveGame();
    }

    function boot() {
      loadMeta();
      state.phase = "menu";
      state.gameOver = false;
      state.victory = false;
      state.player.equipped = makeLoot("sword");
      state.runStats = baseRunStats(state.selectedHero);
      recalcStats();
      toggleShop(false);
      generateMap();
      state.enemies.length = 0;
      state.drops.length = 0;
      state.projectiles.length = 0;
      state.enemyProjectiles.length = 0;
      renderMenu();
    }

    function continueRun() {
      if (!loadGame()) return;
      state.phase = "running";
      state.gameOver = false;
      state.victory = false;
      ui.menuScreen.classList.remove("on");
      ui.resultScreen.classList.remove("on");
      ui.boonScreen.classList.remove("on");
      toggleShop(false);
      spawnRoom();
      showBanner("继续冒险", 1);
    }

    function bindInput() {
      addEventListener("keydown", e => {
        keys.add(e.code);
        if (e.code === "Space") { e.preventDefault(); attack(); }
        if (e.code === "KeyE") {
          if (!interactNearby()) toggleShop();
        }
        if (e.code === "ShiftLeft" || e.code === "ShiftRight") dash();
        if (e.code === "Enter" && state.phase === "menu") reset();
        if (e.code === "KeyR") {
          if (state.phase === "running") reset();
          else renderMenu();
        }
      });
      addEventListener("keyup", e => keys.delete(e.code));
      ui.atkBtn.addEventListener("pointerdown", e => {
        e.preventDefault();
        aim.active = true;
        aim.id = e.pointerId;
        aim.sx = e.clientX;
        aim.sy = e.clientY;
        aim.dx = state.player.faceX * 24;
        aim.dy = state.player.faceY * 24;
        ui.atkBtn.setPointerCapture(e.pointerId);
      });
      ui.atkBtn.addEventListener("pointermove", e => {
        if (!aim.active || e.pointerId !== aim.id) return;
        aim.dx = e.clientX - aim.sx;
        aim.dy = e.clientY - aim.sy;
      });
      const releaseAim = e => {
        if (!aim.active || e.pointerId !== aim.id) return;
        const d = Math.hypot(aim.dx, aim.dy);
        if (d > 10) attack(aim.dx / d, aim.dy / d);
        else attack();
        aim.active = false;
        aim.id = null;
        aim.dx = 0;
        aim.dy = 0;
      };
      ui.atkBtn.addEventListener("pointerup", releaseAim);
      ui.atkBtn.addEventListener("pointercancel", releaseAim);
      ui.dashBtn.addEventListener("pointerdown", e => { e.preventDefault(); dash(); });
      ui.shopBtn.addEventListener("pointerdown", e => { e.preventDefault(); if (!interactNearby()) toggleShop(); });
      ui.closeShopBtn.onclick = () => toggleShop(false);
      ui.healBtn.onclick = () => {
        if (state.player.gold >= 20 && state.player.hp < state.player.maxHp) {
          state.player.gold -= 20;
          state.player.hp = Math.min(state.player.maxHp, state.player.hp + 45);
          saveGame();
        }
      };
      ui.startBtn.onclick = () => reset();
      ui.continueBtn.onclick = () => continueRun();
      ui.clearMetaBtn.onclick = () => {
        state.meta = { souls: 0, upgrades: { vitality: 0, blade: 0, wallet: 0 } };
        saveMeta();
        localStorage.removeItem(SAVE_KEY);
        renderMenu();
      };
      ui.againBtn.onclick = () => {
        ui.resultScreen.classList.remove("on");
        renderMenu();
      };
      ui.menuBtn.onclick = () => {
        ui.resultScreen.classList.remove("on");
        renderMenu();
      };
      ui.resultContinueBtn.onclick = () => renderMenu();

      ui.stick.addEventListener("pointerdown", e => {
        joystick.active = true;
        joystick.id = e.pointerId;
        const r = ui.stick.getBoundingClientRect();
        joystick.x = r.left + r.width / 2;
        joystick.y = r.top + r.height / 2;
        ui.stick.setPointerCapture(e.pointerId);
        updateStick(e.clientX, e.clientY);
      });
      ui.stick.addEventListener("pointermove", e => {
        if (joystick.active && e.pointerId === joystick.id) updateStick(e.clientX, e.clientY);
      });
      const endStick = e => {
        if (e.pointerId !== joystick.id) return;
        joystick.active = false;
        joystick.id = null;
        joystick.dx = 0; joystick.dy = 0;
        ui.knob.style.transform = "translate(0px, 0px)";
      };
      ui.stick.addEventListener("pointerup", endStick);
      ui.stick.addEventListener("pointercancel", endStick);
    }

    function updateStick(x, y) {
      const max = 40;
      let dx = x - joystick.x, dy = y - joystick.y;
      const d = Math.hypot(dx, dy);
      if (d > max) { dx = dx / d * max; dy = dy / d * max; }
      joystick.dx = dx / max;
      joystick.dy = dy / max;
      ui.knob.style.transform = "translate(" + dx + "px, " + dy + "px)";
    }

    window.addEventListener("resize", resize);
    resize();
    bindInput();
    boot();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
