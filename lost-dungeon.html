<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>失落地下城 Canvas 原型</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      background: #101116;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101116;
      touch-action: none;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
      background: #101116;
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: #f5e6c9;
      text-shadow: 0 2px 0 #18100e;
    }

    .topbar {
      position: absolute;
      left: 14px;
      top: 10px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      font-weight: 800;
      font-size: 14px;
    }

    .panel {
      min-width: 170px;
      padding: 10px 12px;
      border: 2px solid #36281d;
      background: rgba(22, 18, 18, .78);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.04);
      border-radius: 6px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0;
      white-space: nowrap;
    }

    .bar {
      width: 118px;
      height: 10px;
      border: 2px solid #2b1f1b;
      background: #2a1818;
      overflow: hidden;
    }

    .fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #d03d38, #ff7561);
    }

    .stamina .fill { background: linear-gradient(90deg, #2fbb73, #8be06a); }
    .bossline { display: none; }
    .bossline.on { display: flex; }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      max-width: min(720px, calc(100vw - 32px));
      padding: 10px 14px;
      border: 2px solid #3d2d20;
      background: rgba(20, 17, 17, .76);
      border-radius: 6px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    .stick {
      position: absolute;
      left: 24px;
      bottom: 28px;
      width: 116px;
      height: 116px;
      border-radius: 50%;
      pointer-events: auto;
      border: 3px solid rgba(238, 205, 157, .35);
      background: rgba(23, 20, 22, .48);
      box-shadow: inset 0 0 26px rgba(0,0,0,.45);
    }

    .knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44px;
      height: 44px;
      margin-left: -22px;
      margin-top: -22px;
      border-radius: 50%;
      border: 3px solid rgba(255, 231, 182, .7);
      background: #8f6942;
    }

    .buttons {
      position: absolute;
      right: 24px;
      bottom: 32px;
      display: grid;
      grid-template-columns: 72px 72px;
      grid-template-rows: 72px 72px;
      gap: 12px;
      pointer-events: auto;
    }

    .btn {
      border: 3px solid rgba(255, 224, 170, .5);
      background: rgba(113, 52, 42, .68);
      color: #ffe8ba;
      border-radius: 50%;
      font-weight: 900;
      font-size: 13px;
      display: grid;
      place-items: center;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,.22);
      touch-action: none;
    }

    .btn:active, .btn.down {
      transform: translateY(2px);
      background: rgba(187, 76, 54, .78);
    }

    .btn.small {
      width: 56px;
      height: 56px;
      place-self: end;
      background: rgba(51, 80, 91, .65);
    }

    .shop {
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      width: min(720px, calc(100vw - 28px));
      max-height: calc(100vh - 36px);
      display: none;
      pointer-events: auto;
      border: 3px solid #513c29;
      background: #171416;
      color: #f9e4bd;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 18px 80px rgba(0,0,0,.55);
    }

    .shop.on { display: block; }

    .shop h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .item {
      border: 2px solid #3f3025;
      background: #211b1d;
      padding: 10px;
      border-radius: 6px;
      min-height: 132px;
    }

    .item strong {
      display: block;
      color: #ffd27e;
      margin-bottom: 6px;
    }

    .item p {
      margin: 0 0 8px;
      font-size: 12px;
      color: #d8bea1;
      line-height: 1.35;
    }

    .item button, .shop-actions button {
      width: 100%;
      min-height: 34px;
      border: 2px solid #70502d;
      background: #7a3a2d;
      color: #fff0c8;
      font-weight: 800;
      border-radius: 5px;
      cursor: pointer;
    }

    .item button:disabled {
      opacity: .5;
      cursor: default;
    }

    .shop-actions {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .center-banner {
      position: absolute;
      left: 50%;
      top: 16%;
      transform: translateX(-50%);
      font-weight: 900;
      font-size: clamp(20px, 4vw, 42px);
      color: #ffd27e;
      opacity: 0;
      transition: opacity .25s;
      text-align: center;
      white-space: nowrap;
    }

    .center-banner.on { opacity: 1; }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      pointer-events: auto;
      background:
        linear-gradient(rgba(12, 10, 13, .82), rgba(12, 10, 13, .9)),
        radial-gradient(circle at 50% 28%, rgba(126, 73, 43, .34), transparent 42%);
    }

    .screen.on { display: flex; }

    .menu-box {
      width: min(920px, calc(100vw - 28px));
      max-height: calc(100vh - 28px);
      overflow: auto;
      border: 3px solid #60442c;
      background: #171416;
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 24px 90px rgba(0, 0, 0, .62);
    }

    .menu-title {
      margin: 0 0 6px;
      font-size: clamp(26px, 5vw, 48px);
      color: #ffd27e;
      letter-spacing: 0;
    }

    .menu-sub {
      margin: 0 0 16px;
      color: #d8bea1;
      line-height: 1.45;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 10px 0 14px;
    }

    .choice {
      min-height: 96px;
      padding: 12px;
      text-align: left;
      border: 2px solid #3f3025;
      background: #211b1d;
      color: #f9e4bd;
      border-radius: 6px;
      cursor: pointer;
    }

    .choice.selected {
      border-color: #ffd27e;
      box-shadow: inset 0 0 0 2px rgba(255, 210, 126, .18);
    }

    .choice strong {
      display: block;
      margin-bottom: 6px;
      color: #ffd27e;
      font-size: 15px;
    }

    .choice span {
      display: block;
      color: #d8bea1;
      font-size: 12px;
      line-height: 1.35;
    }

    .menu-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .menu-actions button {
      min-height: 42px;
      border: 2px solid #70502d;
      background: #7a3a2d;
      color: #fff0c8;
      font-weight: 900;
      border-radius: 5px;
      cursor: pointer;
    }

    .meta-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .meta-card {
      border: 2px solid #3f3025;
      background: #1f1a1b;
      padding: 10px;
      border-radius: 6px;
    }

    .meta-card button {
      width: 100%;
      margin-top: 8px;
      min-height: 32px;
      border: 2px solid #70502d;
      background: #33505b;
      color: #fff0c8;
      font-weight: 800;
      border-radius: 5px;
      cursor: pointer;
    }

    @media (max-width: 720px) {
      .topbar {
        font-size: 12px;
        gap: 8px;
      }

      .panel {
        min-width: 140px;
        padding: 8px;
      }

      .bar { width: 86px; }
      .hint { display: none; }
      .stick {
        left: 16px;
        bottom: 18px;
        width: 104px;
        height: 104px;
      }

      .buttons {
        right: 16px;
        bottom: 20px;
        grid-template-columns: 64px 64px;
        grid-template-rows: 64px 64px;
      }

      .shop-grid {
        grid-template-columns: 1fr;
        overflow: auto;
        max-height: 60vh;
      }

      .screen { padding: 10px; }
      .menu-box { padding: 12px; }
      .choice-grid,
      .menu-actions,
      .meta-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="topbar">
      <div class="panel">
        <div class="stat-row">生命 <div class="bar"><div id="hpFill" class="fill"></div></div> <span id="hpText"></span></div>
        <div class="stat-row stamina">体力 <div class="bar"><div id="spFill" class="fill"></div></div> <span id="spText"></span></div>
        <div class="stat-row">金币 <span id="goldText">0</span> | 武器 <span id="weaponText">剑</span></div>
        <div class="stat-row">属性 <span id="attrText">暴击 5% | 攻速 0% | 移速 0% | 吸血 0%</span></div>
      </div>
      <div class="panel">
        <div class="stat-row">关卡 <span id="levelText">1</span>/5 | 房间 <span id="roomText">1</span></div>
        <div id="bossLine" class="stat-row bossline">Boss <div class="bar"><div id="bossFill" class="fill"></div></div></div>
        <div class="stat-row">敌人 <span id="enemyText">0</span> | 已购 <span id="ownedText">1</span>/5</div>
        <div class="stat-row">房间 <span id="lockText">封锁中</span> | <span id="saveText">自动存档</span></div>
      </div>
    </div>
    <div id="banner" class="center-banner"></div>
    <div class="hint">WASD/方向键移动，空格/攻击键攻击，Shift/闪避键翻滚，E/商店键开商店。清怪开门，掉落武器按白/蓝/紫/橙品质生成属性。</div>
    <div id="stick" class="stick"><div id="knob" class="knob"></div></div>
    <div class="buttons">
      <div></div>
      <button id="shopBtn" class="btn small">商店</button>
      <button id="dashBtn" class="btn small">闪避</button>
      <button id="atkBtn" class="btn">攻击</button>
    </div>
    <div id="shop" class="shop">
      <h2>地下城铁匠铺</h2>
      <div id="shopGrid" class="shop-grid"></div>
      <div class="shop-actions">
        <button id="healBtn">恢复生命 20G</button>
        <button id="closeShopBtn">继续冒险</button>
      </div>
    </div>
    <div id="menuScreen" class="screen on">
      <div class="menu-box">
        <h1 class="menu-title">失落地下城</h1>
        <p class="menu-sub">选择流派后开始一局。清房获得祝福，Boss 后进入下一层，死亡会把本局魂晶带回局外升级。</p>
        <h3>角色</h3>
        <div id="heroChoices" class="choice-grid"></div>
        <h3>初始武器</h3>
        <div id="weaponChoices" class="choice-grid"></div>
        <h3>难度</h3>
        <div id="difficultyChoices" class="choice-grid"></div>
        <div class="meta-row" id="metaUpgrades"></div>
        <div class="menu-actions">
          <button id="continueBtn">继续存档</button>
          <button id="startBtn">开始新一局</button>
          <button id="clearMetaBtn">清空局外</button>
        </div>
      </div>
    </div>
    <div id="boonScreen" class="screen">
      <div class="menu-box">
        <h1 class="menu-title">选择祝福</h1>
        <p class="menu-sub">每个房间后选择一个本局强化，祝福只在当前一局生效。</p>
        <div id="boonChoices" class="choice-grid"></div>
      </div>
    </div>
    <div id="resultScreen" class="screen">
      <div class="menu-box">
        <h1 id="resultTitle" class="menu-title">结算</h1>
        <p id="resultText" class="menu-sub"></p>
        <div class="menu-actions">
          <button id="againBtn">再来一局</button>
          <button id="menuBtn">回到选择</button>
          <button id="resultContinueBtn">继续挑战</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  (() => {
    "use strict";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const ui = {
      hpFill: document.getElementById("hpFill"),

      { name: "熔岩术士", color: "#c44d34", hp: 1050, speed: 48, attack: 22, trait: "rings" },
      { name: "双刃屠夫", color: "#b94375", hp: 1280, speed: 82, attack: 24, trait: "summon" },

    const THEMES = [
      { name: "古堡地牢", floor: "#222126", floor2: "#17181b", wall: "#21191e", wallTop: "#3a2a2d", trim: "#4c352f", accent: "#ffd27e" },

    const joystick = { active: false, id: null, x: 0, y: 0, dx: 0, dy: 0 };

    function resize() {
      const dpr = Math.min(DPR_MAX, window.devicePixelRatio || 1);
      state.w = Math.floor(innerWidth * dpr);
      state.h = Math.floor(innerHeight * dpr);
      state.scale = dpr;
      canvas.width = state.w;

      ctx.imageSmoothingEnabled = false;

    function showBanner(text, seconds = 1.6) {
      state.bannerText = text;
      state.bannerUntil = now() + seconds;
      ui.banner.textContent = text;
      ui.banner.classList.add("on");

    function weapon() {
      return WEAPONS.find(w => w.id === state.player.weapon);
    }

    function theme() {
      return THEMES[Math.min(THEMES.length - 1, state.level - 1)] || THEMES[0];
    }

    function chooseQuality(pool) {
      const list = pool ? QUALITIES.filter(q => pool.includes(q.id)) : QUALITIES;
      const total = list.reduce((sum, q) => sum + q.weight, 0);
      let roll = rand(0, total);
      for (const q of list) {
        roll -= q.weight;
        if (roll <= 0) return q;
      }
      return list[0] || QUALITIES[0];
    }

    function makeLoot(baseId, pool) {
      const base = WEAPONS.find(w => w.id === baseId) || WEAPONS[0];
      const q = chooseQuality(pool);
      return {
        id: base.id,
        name: q.name + "·" + base.name,
        quality: q.id,
        qualityName: q.name,
        qualityColor: q.color,
        damage: Math.round(base.damage * q.mult),
        cd: Math.max(.08, base.cd / (1 + q.atkSpeed)),
        stamina: base.stamina,
        range: base.range,
        color: base.color,
        outline: q.color,
        crit: q.crit,
        atkSpeed: q.atkSpeed,
        move: q.move,
        lifesteal: q.lifesteal,
        desc: base.desc
      };
    }

    function currentGear() {
      if (!state.player.equipped) state.player.equipped = makeLoot(state.player.weapon);
      const base = WEAPONS.find(w => w.id === state.player.equipped.id) || WEAPONS[0];
      if (!state.player.equipped.qualityColor) {
        const q = QUALITIES.find(q => q.id === state.player.equipped.quality) || QUALITIES[0];
        state.player.equipped = { ...base, ...state.player.equipped, qualityColor: q.color, qualityName: q.name };
      }
      return state.player.equipped;
    }

    function recalcStats() {
      const g = currentGear();
      const run = state.runStats || baseRunStats();
      state.player.weapon = g.id;
      state.player.stats = {
        crit: run.crit + g.crit,
        atkSpeed: run.atkSpeed + g.atkSpeed,
        move: run.move + g.move,
        lifesteal: run.lifesteal + g.lifesteal
      };
      state.player.maxHp = run.maxHp;
      state.player.speed = run.speed;
    }

    function baseRunStats(heroId = state.selectedHero) {
      const hero = HEROES.find(h => h.id === heroId) || HEROES[0];
      const meta = state.meta.upgrades;
      return {
        hero: hero.id,
        maxHp: hero.hp + meta.vitality * 8,
        maxSp: hero.sp,
        speed: hero.speed,
        crit: hero.crit,
        atkSpeed: 0,
        move: hero.move,
        lifesteal: hero.lifesteal,
        damage: meta.blade * .04,
        projectileDamage: 0,
        reflect: false,
        damageTaken: 0,
        meleeRange: 0,
        staminaRegen: 0,
        goldMult: meta.wallet * .06,
        soulMult: meta.wallet * .06,
        boons: []
      };
    }

    function loadMeta() {
      try {
        const data = JSON.parse(localStorage.getItem(META_KEY) || "null");
        if (data && data.upgrades) state.meta = data;
      } catch (_) {}
    }

    function saveMeta() {
      localStorage.setItem(META_KEY, JSON.stringify(state.meta));
    }

    function addSouls(amount) {
      const gain = Math.max(1, Math.round(amount * state.difficulty.reward * (1 + (state.runStats?.soulMult || 0))));
      state.meta.souls += gain;
      saveMeta();
      return gain;
    }

    function selectCard(container, value, cb) {
      for (const el of container.querySelectorAll(".choice")) {
        el.classList.toggle("selected", el.dataset.id === value);
        el.onclick = () => cb(el.dataset.id);
      }
    }

    function renderMenu() {
      ui.menuScreen.classList.add("on");
      ui.boonScreen.classList.remove("on");
      ui.resultScreen.classList.remove("on");
      ui.heroChoices.innerHTML = HEROES.map(h => "<button class='choice' data-id='" + h.id + "'><strong>" + h.name + "</strong><span>" + h.desc + "<br>生命 " + h.hp + " | 速度 " + h.speed + "</span></button>").join("");
      ui.weaponChoices.innerHTML = WEAPONS.map(w => "<button class='choice' data-id='" + w.id + "'><strong>" + w.name + "</strong><span>" + w.desc + "<br>伤害 " + w.damage + " | 冷却 " + w.cd + "s</span></button>").join("");
      ui.difficultyChoices.innerHTML = DIFFICULTIES.map(d => "<button class='choice' data-id='" + d.id + "'><strong>" + d.name + "</strong><span>" + d.desc + "<br>敌血 x" + d.enemyHp + " | 奖励 x" + d.reward + "</span></button>").join("");
      renderMeta();
      selectCard(ui.heroChoices, state.selectedHero, id => { state.selectedHero = id; renderMenu(); });
      selectCard(ui.weaponChoices, state.selectedWeapon, id => { state.selectedWeapon = id; renderMenu(); });
      selectCard(ui.difficultyChoices, state.selectedDifficulty, id => { state.selectedDifficulty = id; renderMenu(); });
      ui.continueBtn.disabled = !localStorage.getItem(SAVE_KEY);
    }

    function renderMeta() {
      ui.metaUpgrades.innerHTML = "<div class='meta-card'><strong>魂晶 " + state.meta.souls + "</strong><p>死亡或通关后获得，用于永久升级。</p></div>" + META_UPGRADES.map(u => {
        const lv = state.meta.upgrades[u.id] || 0;
        const cost = u.cost * (lv + 1);
        return "<div class='meta-card'><strong>" + u.name + " Lv." + lv + "</strong><p>" + u.desc + "</p><button data-id='" + u.id + "'>" + cost + " 魂晶升级</button></div>";
      }).join("");
      for (const btn of ui.metaUpgrades.querySelectorAll("button")) {
        btn.onclick = () => {
          const u = META_UPGRADES.find(x => x.id === btn.dataset.id);
          const lv = state.meta.upgrades[u.id] || 0;
          const cost = u.cost * (lv + 1);
          if (state.meta.souls >= cost) {
            state.meta.souls -= cost;
            state.meta.upgrades[u.id] = lv + 1;
            saveMeta();
            renderMenu();
          }
        };
      }
    }

    function playSound(type) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const t = audioCtx.currentTime;
        const tones = {
          attack: [220, 420, .07, "square"],
          hurt: [120, 70, .16, "sawtooth"],
          coin: [680, 980, .11, "triangle"],
          boss: [90, 42, .75, "sawtooth"],
          drop: [520, 760, .18, "triangle"]
        };
        const s = tones[type] || tones.attack;
        osc.type = s[3];
        osc.frequency.setValueAtTime(s[0], t);
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, s[1]), t + s[2]);
        gain.gain.setValueAtTime(.0001, t);
        gain.gain.exponentialRampToValueAtTime(.12, t + .015);
        gain.gain.exponentialRampToValueAtTime(.0001, t + s[2]);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + s[2] + .03);
      } catch (_) {}
    }

    function saveGame() {
      const p = state.player;
      const data = {
        selectedHero: state.selectedHero,
        selectedWeapon: state.selectedWeapon,
        selectedDifficulty: state.selectedDifficulty,
        runStats: state.runStats,
        level: state.level,
        room: state.room,
        hp: p.hp,
        maxHp: p.maxHp,
        sp: p.sp,
        maxSp: p.maxSp,
        gold: p.gold,
        weapon: p.weapon,
        owned: [...p.owned],
        equipped: p.equipped
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      state.savedFlash = 1.2;
    }

    function loadGame() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return false;
        const data = JSON.parse(raw);
        state.selectedHero = data.selectedHero || state.selectedHero;
        state.selectedWeapon = data.selectedWeapon || state.selectedWeapon;
        state.selectedDifficulty = data.selectedDifficulty || state.selectedDifficulty;
        state.difficulty = DIFFICULTIES.find(d => d.id === state.selectedDifficulty) || DIFFICULTIES[0];
        state.runStats = data.runStats || baseRunStats(state.selectedHero);
        state.level = clamp(data.level || 1, 1, 5);
        state.room = clamp(data.room || 1, 1, state.maxRoom);
        state.player.hp = clamp(data.hp || state.player.maxHp, 1, state.player.maxHp);
        state.player.sp = clamp(data.sp || state.player.maxSp, 0, state.player.maxSp);
        state.player.gold = data.gold || 0;
        state.player.weapon = data.weapon || "sword";
        state.player.owned = new Set(data.owned && data.owned.length ? data.owned : ["sword"]);
        state.player.equipped = data.equipped || makeLoot(state.player.weapon);
        recalcStats();
        return true;
      } catch (_) {
        return false;
      }
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function entityRect(e) {
      return { x: e.x - e.r, y: e.y - e.r, w: e.r * 2, h: e.r * 2 };
    }

    function tileAt(tx, ty) {
      if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return 1;
      return state.map[ty][tx];
    }

    function isSolidWorld(x, y) {
      for (const c of state.covers) {
        if (x >= c.x - c.w / 2 && x <= c.x + c.w / 2 && y >= c.y - c.h / 2 && y <= c.y + c.h / 2) return true;
      }
      return tileAt(Math.floor(x / TILE), Math.floor(y / TILE)) === 1;
    }

    function objectRadius(o) {
      if (!o) return 0;
      if (typeof o.r === "number") return o.r;
      if (typeof o.w === "number" || typeof o.h === "number") return Math.max(o.w || 0, o.h || 0) / 2;
      return 14;
    }

    function isSpawnPointClear(p, minDist = 140, extraRadius = 24) {
      if (!p) return false;
      if (dist(p, state.player) < minDist) return false;
      const ex = state.exit.x + state.exit.w / 2;
      const ey = state.exit.y + state.exit.h / 2;
      if (Math.hypot(p.x - ex, p.y - ey) < 150) return false;
      if (isSolidWorld(p.x, p.y)) return false;
      const occupied = [state.enemies, state.chests, state.bombs, state.covers, state.spikes, state.drops];
      for (const list of occupied) {
        for (const o of list) {
          if (!o || o.dead || o.opened) continue;
          if (Math.hypot(p.x - o.x, p.y - o.y) < extraRadius + objectRadius(o)) return false;
        }
      }
      return true;
    }

    function tileBlockedByDynamic(tx, ty) {
      const tile = { x: tx * TILE, y: ty * TILE, w: TILE, h: TILE };
      for (const c of state.covers) {
        if (c.hp <= 0) continue;
        const cover = { x: c.x - c.w / 2, y: c.y - c.h / 2, w: c.w, h: c.h };
        if (rectsOverlap(tile, cover)) return true;
      }
      return false;
    }

    function cellIsOpenSafe(x, y) {
      if (tileAt(x, y) !== 0) return false;
      for (let oy = -1; oy <= 1; oy++) {
        for (let ox = -1; ox <= 1; ox++) {
          if (tileAt(x + ox, y + oy) !== 0) return false;
        }
      }
      return true;
    }

    function refreshFloorCells() {
      state.floorCells = [];
      state.reachableCells = [];
      for (let y = 1; y < MAP_H - 1; y++) {
        for (let x = 1; x < MAP_W - 1; x++) {
          if (cellIsOpenSafe(x, y)) state.floorCells.push({ x, y });
        }
      }
      const startX = Math.floor(state.player.x / TILE);
      const startY = Math.floor(state.player.y / TILE);
      if (tileAt(startX, startY) !== 0) return;
      const q = [{ x: startX, y: startY }];
      const seen = new Set([startX + "," + startY]);
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      for (let qi = 0; qi < q.length && qi < 1200; qi++) {
        const n = q[qi];
        if (cellIsOpenSafe(n.x, n.y)) state.reachableCells.push({ x: n.x, y: n.y });
        for (const d of dirs) {
          const nx = n.x + d[0], ny = n.y + d[1], key = nx + "," + ny;
          if (seen.has(key) || tileAt(nx, ny) !== 0) continue;
          seen.add(key);
          q.push({ x: nx, y: ny });
        }
      }
    }

    function moveEntity(e, dt) {
      e.x += e.vx * dt;
      resolveTileCollision(e, true);
      resolveCoverCollision(e, true);
      e.y += e.vy * dt;
      resolveTileCollision(e, false);
      resolveCoverCollision(e, false);
    }

    function resolveCoverCollision(e, horizontal) {
      for (const c of state.covers) {
        const tile = { x: c.x - c.w / 2, y: c.y - c.h / 2, w: c.w, h: c.h };
        const er = entityRect(e);
        if (!rectsOverlap(er, tile)) continue;
        if (horizontal) {
          if (e.vx > 0) e.x = tile.x - e.r;
          else if (e.vx < 0) e.x = tile.x + tile.w + e.r;
          e.vx = 0;
        } else {
          if (e.vy > 0) e.y = tile.y - e.r;
          else if (e.vy < 0) e.y = tile.y + tile.h + e.r;
          e.vy = 0;
        }
      }
    }

    function resolveTileCollision(e, horizontal) {
      const minTx = Math.floor((e.x - e.r) / TILE) - 1;
      const maxTx = Math.floor((e.x + e.r) / TILE) + 1;
      const minTy = Math.floor((e.y - e.r) / TILE) - 1;
      const maxTy = Math.floor((e.y + e.r) / TILE) + 1;
      for (let ty = minTy; ty <= maxTy; ty++) {
        for (let tx = minTx; tx <= maxTx; tx++) {
          if (tileAt(tx, ty) !== 1) continue;
          const tile = { x: tx * TILE, y: ty * TILE, w: TILE, h: TILE };
          const er = entityRect(e);
          if (!rectsOverlap(er, tile)) continue;
          if (horizontal) {
            if (e.vx > 0) e.x = tile.x - e.r;
            else if (e.vx < 0) e.x = tile.x + tile.w + e.r;
            e.vx = 0;
          } else {
            if (e.vy > 0) e.y = tile.y - e.r;
            else if (e.vy < 0) e.y = tile.y + tile.h + e.r;
            e.vy = 0;
          }
        }
      }
    }

    function carveRoom(map, x, y, w, h) {
      for (let yy = y; yy < y + h; yy++) {
        for (let xx = x; xx < x + w; xx++) {
          if (xx > 0 && yy > 0 && xx < MAP_W - 1 && yy < MAP_H - 1) map[yy][xx] = 0;
        }
      }
    }

    function carveWideCorridor(map, ax, ay, bx, by) {
      for (let x = Math.min(ax, bx); x <= Math.max(ax, bx); x++) {
        for (let oy = -2; oy <= 2; oy++) if (ay + oy > 0 && ay + oy < MAP_H - 1) map[ay + oy][x] = 0;
      }
      for (let y = Math.min(ay, by); y <= Math.max(ay, by); y++) {
        for (let ox = -2; ox <= 2; ox++) if (bx + ox > 0 && bx + ox < MAP_W - 1) map[y][bx + ox] = 0;
      }
    }

    function generateMap() {
      const map = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(1));
      const centerY = Math.floor(MAP_H / 2) + irand(-2, 2);
      const rooms = [
        { x: 2, y: centerY - 5, w: 10, h: 10 },
        { x: 14, y: centerY + irand(-7, 1), w: 11, h: 9 },
        { x: 28, y: centerY + irand(-6, 2), w: 11, h: 9 },
        { x: 40, y: centerY - 5, w: 4, h: 10 }
      ];
      if (Math.random() < .9) rooms.push({ x: irand(9, 18), y: 2, w: 10, h: 7 });
      if (Math.random() < .9) rooms.push({ x: irand(24, 33), y: MAP_H - 9, w: 10, h: 7 });
      for (const room of rooms) {
        room.cx = Math.floor(room.x + room.w / 2);
        room.cy = Math.floor(room.y + room.h / 2);
        carveRoom(map, room.x, room.y, room.w, room.h);
      }
      const mainRooms = rooms.slice(0, 4);
      for (let i = 1; i < mainRooms.length; i++) {
        const a = mainRooms[i - 1], b = mainRooms[i];
        carveWideCorridor(map, a.cx, a.cy, b.cx, b.cy);
      }
      for (let i = 4; i < rooms.length; i++) {
        const anchor = rooms[i].y < centerY ? mainRooms[1] : mainRooms[2];
        carveWideCorridor(map, anchor.cx, anchor.cy, rooms[i].cx, rooms[i].cy);
      }
      const start = mainRooms[0];
      const end = mainRooms[3];
      map[start.cy][start.cx] = 0;
      map[end.cy][end.cx] = 0;

      state.map = map;
      state.floorDots = [];
      const th = theme();
      for (let y = 0; y < MAP_H; y++) {
        for (let x = 0; x < MAP_W; x++) {
          if (map[y][x] === 0 && Math.random() < .22) {
            state.floorDots.push({ x: x * TILE + irand(6, 26), y: y * TILE + irand(6, 26), c: Math.random() < .35 ? th.accent : (Math.random() < .5 ? "#342b2b" : "#2a2527") });
          }
        }
      }
      state.player.x = start.cx * TILE + TILE / 2;
      state.player.y = start.cy * TILE + TILE / 2;
      carveRoom(map, start.cx - 3, start.cy - 3, 7, 7);
      state.exit.x = end.cx * TILE + TILE / 2 - 22;
      state.exit.y = end.cy * TILE + TILE / 2 - 48;
      carveRoom(map, end.cx - 3, end.cy - 3, 7, 7);
      state.exit.open = false;
      state.sealedTiles = [
        { x: end.cx - 1, y: end.cy - 2 },
        { x: end.cx - 1, y: end.cy - 1 },
        { x: end.cx - 1, y: end.cy },
        { x: end.cx - 1, y: end.cy + 1 },
        { x: end.cx - 1, y: end.cy + 2 }
      ];
      refreshFloorCells();
      return { rooms, start, end };
    }

    function randomFloorAway(minDist = 140) {
      const cells = state.reachableCells.length ? state.reachableCells : state.floorCells;
      for (let i = 0; i < 700 && cells.length; i++) {
        const c = cells[irand(0, cells.length - 1)];
        const p = { x: c.x * TILE + 16, y: c.y * TILE + 16 };
        if (isSpawnPointClear(p, minDist)) return p;
      }
      for (const c of cells) {
        const p = { x: c.x * TILE + 16, y: c.y * TILE + 16 };
        if (isSpawnPointClear(p, Math.min(minDist, 80))) return p;
      }
      const fallback = { x: state.player.x + 180, y: state.player.y };
      if (isSpawnPointClear(fallback, 0)) return fallback;
      return { x: state.player.x + 180, y: state.player.y + 60 };
    }

    function spawnRoom() {
      generateMap();
      state.enemies.length = 0;
      state.projectiles.length = 0;
      state.enemyProjectiles.length = 0;
      state.particles.length = 0;
      state.drops.length = 0;
      state.chests.length = 0;
      state.bombs.length = 0;
      state.covers.length = 0;
      state.spikes.length = 0;
      state.attacks.length = 0;
      state.warnings.length = 0;
      state.boss = null;
      state.locked = true;
      for (const t of state.sealedTiles) {
        if (t.y > 0 && t.y < MAP_H - 1 && t.x > 0 && t.x < MAP_W - 1) state.map[t.y][t.x] = 1;
      }
      refreshFloorCells();

      const bossRoom = state.room === state.maxRoom;
      if (bossRoom) {
        const bdef = BOSS[state.level - 1];
        const p = randomFloorAway(220);
        state.boss = makeEnemy(p.x, p.y, "boss", Math.round(bdef.hp * state.difficulty.enemyHp), bdef.speed, bdef.color);
        Object.assign(state.boss, {
          name: bdef.name,
          attack: Math.round(bdef.attack * state.difficulty.enemyAtk),
          trait: bdef.trait,
          r: 30,
          value: 90 + state.level * 35,
          maxHp: Math.round(bdef.hp * state.difficulty.enemyHp),
          boss: true,
          phase: 1,
          specialCd: 1.5
        });
        state.enemies.push(state.boss);
        showBanner("Boss: " + bdef.name, 2.2);
        playSound("boss");
      } else {
        const count = state.level === 1
          ? Math.min(11, 1 + state.room + Math.floor(state.room / 2))
          : Math.min(20, 2 + state.room + state.level * 2 + Math.max(0, state.level - 2) * 2);
        for (let i = 0; i < count; i++) {
          const p = randomFloorAway();
          const roll = Math.random();
          let kind;
          if (state.level === 1 && state.room <= 2) {
            kind = roll < .72 ? "crawler" : "archer";
          } else if (state.level <= 2) {
            kind = roll < .35 ? "archer" : roll < .58 ? "brute" : roll < .74 ? "charger" : "crawler";
          } else {
            kind = roll < .24 ? "archer" : roll < .44 ? "brute" : roll < .64 ? "charger" : roll < .8 ? "bomber" : "crawler";
          }
          const hpBase = kind === "brute" ? 46 + state.level * 8 : kind === "archer" ? 28 + state.level * 6 : kind === "charger" ? 34 + state.level * 7 : kind === "bomber" ? 26 + state.level * 7 : 24 + state.level * 5;
          const hp = Math.round(hpBase * state.difficulty.enemyHp);
          const speed = kind === "crawler" ? 106 + state.level * 2 : kind === "brute" ? 66 : kind === "charger" ? 112 + state.level * 3 : kind === "bomber" ? 96 : 82;
          const color = ENEMY_TYPES[kind].color;
          const enemy = makeEnemy(p.x, p.y, kind, hp, speed, color);
          if (state.level > 1 && Math.random() < .08 + state.level * .025) {
            enemy.elite = true;
            enemy.hp = Math.round(enemy.hp * 1.85);
            enemy.maxHp = enemy.hp;
            enemy.attack = Math.round(enemy.attack * 1.25);
            enemy.speed *= 1.08;
            enemy.r += 3;
            enemy.value += 20;
          }
          state.enemies.push(enemy);
        }
        showBanner(theme().name + " - 房间 " + state.room, 1.2);
        spawnRoomObjects();
      }
    }

    function spawnRoomObjects() {
      const points = [];
      const reservePoint = (minDist = 120) => {
        for (let i = 0; i < 40; i++) {
          const p = randomFloorAway(minDist);
          if (isSpawnPointClear(p, minDist)) {
            points.push(p);
            return p;
          }
        }
        return randomFloorAway(minDist);
      };
      const chestCount = Math.random() < .55 ? 1 : 0;
      for (let i = 0; i < chestCount; i++) {
        const p = reservePoint(175);
        state.chests.push({ x: p.x, y: p.y, r: 18, opened: false });
      }
      const bombCount = irand(1, Math.min(4, state.level + 1));
      for (let i = 0; i < bombCount; i++) {
        const p = reservePoint(145);
        state.bombs.push({ x: p.x, y: p.y, r: 16, fuse: 0, dead: false });
      }
      const coverCount = irand(3, 5 + Math.min(3, state.level));
      for (let i = 0; i < coverCount; i++) {
        const p = reservePoint(160);
        state.covers.push({ x: p.x, y: p.y, w: irand(32, 58), h: irand(26, 46), hp: 3, kind: Math.random() < .5 ? "pillar" : "crate" });
      }
      const spikeCount = irand(2, 4 + Math.min(4, state.level));
      for (let i = 0; i < spikeCount; i++) {
        const p = reservePoint(155);
        state.spikes.push({ x: p.x, y: p.y, r: 18, timer: rand(0, 1.8), period: rand(1.7, 2.5), active: false, hurtCd: 0 });
      }
    }

    function lootPoolFor(source) {
      if (source === "boss") return ["purple", "orange"];
      if (source === "elite") return ["blue", "purple", "orange"];
      if (source === "chest") return state.level >= 4 ? ["blue", "purple", "orange"] : ["white", "blue", "purple"];
      return state.level >= 3 ? ["white", "blue", "purple"] : ["white", "blue"];
    }

    function dropGearAt(x, y, source) {
      const base = WEAPONS[irand(0, WEAPONS.length - 1)];
      state.drops.push({ x, y, r: 10, gear: makeLoot(base.id, lootPoolFor(source)), life: source === "normal" ? 18 : 999 });
    }

    function openChest(chest) {
      if (!chest || chest.opened) return false;
      chest.opened = true;
      const gold = 25 + state.level * 12;
      state.player.gold += gold;
      state.drops.push({ x: chest.x - 12, y: chest.y, r: 8, value: gold, life: 2.8 });
      if (Math.random() < .75) dropGearAt(chest.x + 16, chest.y, "chest");
      spawnParticles(chest.x, chest.y, "#ffd35d", 24);
      showBanner("宝箱开启 +" + gold + "G", 1);
      playSound("coin");
      saveGame();
      return true;
    }

    function triggerBomb(bomb, delay = .45) {
      if (!bomb || bomb.dead || bomb.fuse > 0) return;
      bomb.fuse = delay;
      spawnParticles(bomb.x, bomb.y, "#ffdf5a", 8);
    }

    function explodeBomb(bomb) {
      if (!bomb || bomb.dead) return;
      bomb.dead = true;
      const radius = 120;
      spawnWarning(bomb.x, bomb.y, radius, .05, "circle", 0, () => {});
      spawnParticles(bomb.x, bomb.y, "#ff8d4a", 42);
      for (const e of state.enemies) {
        if (e.dead) continue;
        const d = Math.hypot(e.x - bomb.x, e.y - bomb.y);
        if (d < radius + e.r) damageEnemy(e, 70 + state.level * 24, (e.x - bomb.x) * 5, (e.y - bomb.y) * 5);
      }
      if (Math.hypot(state.player.x - bomb.x, state.player.y - bomb.y) < radius) damagePlayer(18 + state.level * 4, bomb.x, bomb.y);
      state.shake = .35;
      playSound("hurt");
    }

    function makeEnemy(x, y, type, hp, speed, color) {
      const def = ENEMY_TYPES[type] || ENEMY_TYPES.crawler;
      return {
        x, y, vx: 0, vy: 0, r: def.r, type, hp, maxHp: hp, speed, color,
        attack: Math.round(def.attack * state.difficulty.enemyAtk), cd: rand(.3, 1.2), hurtCd: 0, pathCd: 0, target: null,
        value: def.value, knockX: 0, knockY: 0, chargeCd: rand(.6, 1.4), fuse: 0
      };
    }

    function nextRoom() {
      state.phase = "running";
      if (state.room < state.maxRoom) {
        state.room++;
      } else if (state.level < 5) {
        state.level++;
        state.room = 1;
        state.player.hp = Math.min(state.player.maxHp, state.player.hp + 35);
        state.player.sp = state.player.maxSp;
      } else {
        state.victory = true;
        finishRun(true);
      }
      saveGame();
      if (!state.victory) spawnRoom();
    }

    function finishRun(won) {
      if (state.phase === "result") return;
      const roomsCleared = (state.level - 1) * state.maxRoom + Math.max(0, state.room - (state.locked ? 1 : 0));
      const souls = addSouls((won ? 35 : 8) + roomsCleared * 3);
      state.phase = "result";
      state.gameOver = !won;
      state.victory = won;
      ui.resultTitle.textContent = won ? "通关成功" : "冒险结束";
      ui.resultText.textContent = "到达第 " + state.level + " 关第 " + state.room + " 房，带回 " + souls + " 魂晶。局外升级已保存。";
      ui.resultContinueBtn.style.display = won ? "none" : "none";
      ui.resultScreen.classList.add("on");
      ui.menuScreen.classList.remove("on");
      ui.boonScreen.classList.remove("on");
      localStorage.removeItem(SAVE_KEY);
      saveMeta();
    }

    function offerBoons() {
      if (state.phase !== "running" || state.room === state.maxRoom) return;
      state.phase = "boon";
      const picked = [];
      while (picked.length < 3) {
        const b = BOONS[irand(0, BOONS.length - 1)];
        if (!picked.includes(b)) picked.push(b);
      }
      ui.boonChoices.innerHTML = picked.map(b => "<button class='choice' data-id='" + b.id + "'><strong>" + b.name + "</strong><span>" + b.desc + "</span></button>").join("");
      for (const btn of ui.boonChoices.querySelectorAll("button")) {
        btn.onclick = () => {
          const boon = BOONS.find(b => b.id === btn.dataset.id);
          boon.apply(state.runStats);
          state.runStats.boons.push(boon.name);
          recalcStats();
          state.player.hp = Math.min(state.player.maxHp, state.player.hp + 12);
          ui.boonScreen.classList.remove("on");
          state.phase = "running";
          showBanner("获得祝福：" + boon.name, 1.4);
          saveGame();
        };
      }
      ui.boonScreen.classList.add("on");
    }

    function damageEnemy(e, amount, kx, ky) {
      if (e.boss) amount *= e.phase >= 3 ? .62 : e.phase >= 2 ? .72 : .82;
      e.hp -= amount;
      e.hurtCd = .12;
      e.vx += kx;
      e.vy += ky;
      if (state.player.stats.lifesteal > 0) {
        state.player.hp = Math.min(state.player.maxHp, state.player.hp + amount * state.player.stats.lifesteal);
      }
      spawnParticles(e.x, e.y, e.color, 8);
      if (e.hp <= 0) {
        e.dead = true;
        state.player.gold += Math.round(e.value * (1 + (state.runStats?.goldMult || 0)));
        state.drops.push({ x: e.x, y: e.y, r: 8, value: e.value, life: 2.8 });
        const dropChance = e.boss ? 1 : e.elite ? .85 : .08 + state.level * .02;
        if (Math.random() < dropChance) {
          dropGearAt(e.x + rand(-12, 12), e.y + rand(-12, 12), e.boss ? "boss" : e.elite ? "elite" : "normal");
          playSound("drop");
        }
        spawnParticles(e.x, e.y, "#ffd35d", 18);
        if (e.boss) {
          showBanner(e.name + " 已击败！", 2.2);
          state.shake = .35;
        }
      }
    }

    function damagePlayer(amount, x, y) {
      const p = state.player;
      if (p.hurtCd > 0 || state.gameOver) return;
      p.hp -= Math.max(1, Math.round(amount * (1 + (state.runStats?.damageTaken || 0))));
      p.anim = "hurt";
      p.animTime = .22;
      p.hurtCd = .55;
      const ang = Math.atan2(p.y - y, p.x - x);
      p.vx += Math.cos(ang) * 140;
      p.vy += Math.sin(ang) * 140;
      state.shake = .15;
      spawnParticles(p.x, p.y, "#ff5b52", 12);
      if (p.hp <= 0) {
        p.hp = 0;
        state.gameOver = true;
        p.anim = "dead";
        p.deathTime = 0;
        finishRun(false);
      }
      playSound("hurt");
    }

    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const a = rand(0, Math.PI * 2);
        const s = rand(45, 180);
        state.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.25, .65), color, size: irand(2, 5) });
      }
    }

    function spawnWarning(x, y, radius, delay, kind, angle, fire) {
      state.warnings.push({ x, y, radius, delay, maxDelay: delay, kind, angle, fire, done: false });
    }

    function addProjectile(x, y, vx, vy, damage, color, fromEnemy = false, radius = 6, ttl = 1.5, splash = 0) {
      const arr = fromEnemy ? state.enemyProjectiles : state.projectiles;
      arr.push({ x, y, vx, vy, r: radius, damage, color, ttl, splash });
    }

    function attack(dirX, dirY) {
      const p = state.player;
      const w = weapon();
      const g = currentGear();
      if (state.phase !== "running" || state.shopOpen || state.gameOver || state.victory || p.cooldown > 0 || p.sp < g.stamina) return;
      p.cooldown = g.cd;
      p.sp -= g.stamina;
      p.anim = "attack";
      p.animTime = .18;
      if (Math.hypot(dirX || 0, dirY || 0) > .2) {
        p.faceX = dirX;
        p.faceY = dirY;
      }
      const len = Math.hypot(p.faceX, p.faceY) || 1;
      const fx = p.faceX / len, fy = p.faceY / len;
      const baseAng = Math.atan2(fy, fx);
      ui.atkBtn.classList.add("down");
      setTimeout(() => ui.atkBtn.classList.remove("down"), 90);

      if (w.id === "bow") {
        blockEnemyProjectiles(p.x, p.y, 74, baseAng, 1.2);
        addProjectile(p.x + fx * 20, p.y + fy * 20, fx * 520, fy * 520, rollDamage(g), w.color, false, 5, .9);
        state.trails.push({ x: p.x, y: p.y, angle: baseAng, life: .15, color: currentGear().qualityColor || w.color, len: 28, width: 10 });
        spawnParticles(p.x + fx * 20, p.y + fy * 20, w.color, 4);
      } else if (w.id === "staff") {
        blockEnemyProjectiles(p.x, p.y, 86, baseAng, 1.35);
        addProjectile(p.x + fx * 20, p.y + fy * 20, fx * 310, fy * 310, rollDamage(g), w.color, false, 8, 1.1, 62);
        state.trails.push({ x: p.x, y: p.y, angle: baseAng, life: .18, color: currentGear().qualityColor || w.color, len: 34, width: 14 });
        spawnParticles(p.x + fx * 20, p.y + fy * 20, w.color, 8);
      } else {
        const range = g.range * (1 + (state.runStats?.meleeRange || 0));
        const arc = w.id === "dagger" ? .85 : w.id === "hammer" ? 1.5 : 1.25;
        state.attacks.push({ x: p.x, y: p.y, angle: baseAng, range, arc, life: .12, color: w.color });
        blockEnemyProjectiles(p.x, p.y, range + 18, baseAng, arc);
        hitObjectsInArc(p.x, p.y, range + 18, baseAng, arc);
        for (const e of state.enemies) {
          if (e.dead) continue;
          const dx = e.x - p.x, dy = e.y - p.y;
          const d = Math.hypot(dx, dy);
          if (d > range + e.r) continue;
          let diff = Math.atan2(Math.sin(Math.atan2(dy, dx) - baseAng), Math.cos(Math.atan2(dy, dx) - baseAng));
          if (Math.abs(diff) < arc) {
            const power = w.id === "hammer" ? 320 : w.id === "dagger" ? 90 : 170;
            damageEnemy(e, rollDamage(g), Math.cos(baseAng) * power, Math.sin(baseAng) * power);
          }
        }
        if (w.id === "hammer") {
          addProjectile(p.x + fx * 34, p.y + fy * 34, fx * 240, fy * 240, 18, "#f5b94c", false, 12, .35, 42);
          state.trails.push({ x: p.x, y: p.y, angle: baseAng, life: .22, color: "#f5b94c", len: 40, width: 18 });
          state.shake = .1;
        }
      }
      playSound("attack");
    }

    function hitObjectsInArc(x, y, range, angle, arc) {
      const check = obj => {
        const dx = obj.x - x, dy = obj.y - y;
        const d = Math.hypot(dx, dy);
        if (d > range + (obj.r || 12)) return false;
        const diff = Math.atan2(Math.sin(Math.atan2(dy, dx) - angle), Math.cos(Math.atan2(dy, dx) - angle));
        return Math.abs(diff) <= arc;
      };
      for (const b of state.bombs) if (!b.dead && check(b)) triggerBomb(b, .18);
      for (const c of state.chests) if (!c.opened && check(c)) openChest(c);
      for (const c of state.covers) {
        if (check(c)) {
          c.hp -= 1;
          spawnParticles(c.x, c.y, "#9a6330", 8);
        }
      }
      state.covers = state.covers.filter(c => c.hp > 0);
    }

    function blockEnemyProjectiles(x, y, range, angle, arc) {
      let blocked = 0;
      for (const pr of state.enemyProjectiles) {
        if (pr.dead) continue;
        const dx = pr.x - x, dy = pr.y - y;
        const d = Math.hypot(dx, dy);
        if (d > range + pr.r) continue;
        const diff = Math.atan2(Math.sin(Math.atan2(dy, dx) - angle), Math.cos(Math.atan2(dy, dx) - angle));
        if (Math.abs(diff) > arc) continue;
        pr.dead = true;
        blocked++;
        spawnParticles(pr.x, pr.y, "#bfe8ff", 8);
        if (state.runStats?.reflect) {
          const fx = Math.cos(angle), fy = Math.sin(angle);
          addProjectile(pr.x, pr.y, fx * 360, fy * 360, Math.max(12, pr.damage), "#9be7ff", false, 6, 1.2);
        }
      }
      if (blocked) {
        state.shake = Math.max(state.shake, .08);
        showBanner(state.runStats?.reflect ? "反弹！" : "格挡！", .45);
      }
    }

    function rollDamage(g) {
      const crit = Math.random() < state.player.stats.crit;
      const projectileBoost = (g.id === "bow" || g.id === "staff") ? (state.runStats?.projectileDamage || 0) : 0;
      return Math.round(g.damage * (1 + (state.runStats?.damage || 0) + projectileBoost) * (crit ? 1.8 : 1));
    }

    function dash() {
      const p = state.player;
      if (state.phase !== "running" || p.dashCd > 0 || p.sp < 20 || state.shopOpen) return;
      const ix = inputX(), iy = inputY();
      const len = Math.hypot(ix, iy) || 1;
      p.vx += ix / len * 440;
      p.vy += iy / len * 440;
      p.sp -= 20;
      p.dashCd = .85;
      p.hurtCd = Math.max(p.hurtCd, .18);
      state.trails.push({ x: p.x - ix * 8, y: p.y - iy * 8, angle: Math.atan2(iy, ix), life: .22, color: "#d9e6ff", len: 30, width: 14 });
      spawnParticles(p.x, p.y, "#d9e6ff", 10);
    }

    function inputX() {
      let x = 0;
      if (keys.has("KeyA") || keys.has("ArrowLeft")) x--;
      if (keys.has("KeyD") || keys.has("ArrowRight")) x++;
      x += joystick.dx;
      return clamp(x, -1, 1);
    }

    function inputY() {
      let y = 0;
      if (keys.has("KeyW") || keys.has("ArrowUp")) y--;
      if (keys.has("KeyS") || keys.has("ArrowDown")) y++;
      y += joystick.dy;
      return clamp(y, -1, 1);
    }

    function updatePlayer(dt) {
      const p = state.player;
      p.cooldown = Math.max(0, p.cooldown - dt);
      p.hurtCd = Math.max(0, p.hurtCd - dt);
      p.dashCd = Math.max(0, p.dashCd - dt);
      p.sp = Math.min(p.maxSp, p.sp + 16 * (1 + (state.runStats?.staminaRegen || 0)) * dt);
      let ix = inputX(), iy = inputY();
      const len = Math.hypot(ix, iy);
      if (len > .02 && !state.shopOpen && !state.gameOver && !state.victory) {
        ix /= len; iy /= len;
        p.faceX = ix; p.faceY = iy;
        p.vx += ix * p.speed * (1 + p.stats.move) * 8 * dt;
        p.vy += iy * p.speed * (1 + p.stats.move) * 8 * dt;
        p.anim = "run";
        p.animTime = .12;
      }
      p.animTime = Math.max(0, p.animTime - dt);
      if (p.animTime <= 0 && p.anim !== "dead") p.anim = len > .02 ? "run" : "idle";
      p.vx *= Math.pow(.001, dt);
      p.vy *= Math.pow(.001, dt);
      moveEntity(p, dt);

      state.nearbyGear = null;
      state.nearbyChest = null;
      for (const d of state.drops) {
        if (d.dead) continue;
        const near = Math.hypot(d.x - p.x, d.y - p.y) < 34;
        if (d.gear) {
          if (near) state.nearbyGear = d;
        } else if (near) {
            playSound("coin");
            d.dead = true;
        }
      }
      for (const c of state.chests) {
        if (!c.opened && Math.hypot(c.x - p.x, c.y - p.y) < 46) state.nearbyChest = c;
      }

      if (state.exit.open && rectsOverlap(entityRect(p), state.exit)) nextRoom();
    }

    function pickupNearbyGear() {
      const d = state.nearbyGear;
      if (!d || d.dead || !d.gear || state.phase !== "running") return false;
      const p = state.player;
      p.equipped = JSON.parse(JSON.stringify(d.gear));
      p.weapon = d.gear.id;
      p.owned.add(d.gear.id);
      recalcStats();
      d.dead = true;
      state.nearbyGear = null;
      showBanner("装备 " + p.equipped.name, 1.2);
      playSound("drop");
      saveGame();
      return true;
    }

    function interactNearby() {
      if (state.nearbyChest && openChest(state.nearbyChest)) return true;
      if (pickupNearbyGear()) return true;
      return false;
    }

    function findStep(e) {
      const p = state.player;
      const sx = Math.floor(e.x / TILE), sy = Math.floor(e.y / TILE);
      const gx = Math.floor(p.x / TILE), gy = Math.floor(p.y / TILE);
      if (Math.abs(sx - gx) + Math.abs(sy - gy) > 24) return { x: p.x - e.x, y: p.y - e.y };
      const open = [{ x: sx, y: sy, g: 0, f: Math.abs(sx - gx) + Math.abs(sy - gy) }];
      const best = new Map([[sx + "," + sy, 0]]);
      const parent = new Map();
      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      let found = null;
      for (let guard = 0; open.length && guard < 260; guard++) {
        let bi = 0;
        for (let i = 1; i < open.length; i++) if (open[i].f < open[bi].f) bi = i;
        const n = open.splice(bi, 1)[0];
        if (n.x === gx && n.y === gy) { found = n; break; }
        for (const d of dirs) {
          const nx = n.x + d[0], ny = n.y + d[1], key = nx + "," + ny;
          if (tileAt(nx, ny) === 1 || tileBlockedByDynamic(nx, ny)) continue;
          const g = n.g + 1;
          if (best.has(key) && best.get(key) <= g) continue;
          best.set(key, g);
          parent.set(key, n);
          open.push({ x: nx, y: ny, g, f: g + Math.abs(nx - gx) + Math.abs(ny - gy) });
        }
      }
      if (!found) return { x: p.x - e.x, y: p.y - e.y };
      let cur = found, prev = found;
      while (parent.has(cur.x + "," + cur.y)) {
        prev = cur;
        cur = parent.get(cur.x + "," + cur.y);
        if (cur.x === sx && cur.y === sy) break;
      }
      return { x: prev.x * TILE + 16 - e.x, y: prev.y * TILE + 16 - e.y };
    }

    function updateEnemies(dt) {
      const p = state.player;
      for (const e of state.enemies) {
        if (e.dead) continue;
        e.cd -= dt;
        e.hurtCd = Math.max(0, e.hurtCd - dt);
        e.pathCd -= dt;
        if (e.pathCd <= 0) {
          e.target = findStep(e);
          e.pathCd = e.boss ? .18 : .35;
        }
        const toP = { x: p.x - e.x, y: p.y - e.y };
        const d = Math.hypot(toP.x, toP.y) || 1;
        const target = e.target || toP;
        const td = Math.hypot(target.x, target.y) || 1;
        const wantsRange = e.type === "archer" || (e.boss && (e.trait === "arrows" || e.trait === "rings"));
        let ax = target.x / td, ay = target.y / td;
        if (wantsRange && d < 180) { ax = -toP.x / d; ay = -toP.y / d; }
        if (e.type === "bomber" && d < 64) {
          e.fuse += dt;
          e.color = e.fuse % .22 < .11 ? "#ffcf5d" : ENEMY_TYPES.bomber.color;
          if (e.fuse > .8) {
            e.dead = true;
            spawnWarning(e.x, e.y, 76, .18, "circle", 0, () => {
              if (dist(state.player, e) < 88) damagePlayer(e.attack, e.x, e.y);
              spawnParticles(e.x, e.y, "#ff8d4a", 28);
              state.shake = .22;
            });
          }
        } else {
          e.fuse = Math.max(0, e.fuse - dt);
        }
        if (e.type === "charger") {
          e.chargeCd -= dt;
          if (e.chargeCd <= 0 && d < 300) {
            spawnWarning(e.x, e.y, 160, .42, "line", Math.atan2(toP.y, toP.x), () => {
              const len = d || 1;
              e.vx += toP.x / len * 620;
              e.vy += toP.y / len * 620;
            });
            e.chargeCd = rand(2.2, 3.4);
          }
        }
        e.vx += ax * e.speed * 5 * dt;
        e.vy += ay * e.speed * 5 * dt;
        e.vx *= Math.pow(.01, dt);
        e.vy *= Math.pow(.01, dt);
        moveEntity(e, dt);

        if (d < e.r + p.r + 4 && e.cd <= 0) {
          damagePlayer(e.attack, e.x, e.y);
          e.cd = e.boss ? .75 : .95;
        }

        if (e.type === "archer" && d < 360 && e.cd <= 0) {
          addProjectile(e.x, e.y, toP.x / d * 250, toP.y / d * 250, e.attack, "#e2c46e", true, 5, 1.8);
          e.cd = rand(1.3, 2.2);
        }

        if (e.boss) updateBoss(e, dt, d, toP);
      }
      for (const c of state.covers) {
        const d = Math.hypot(c.x - bomb.x, c.y - bomb.y);
        if (d < radius + Math.max(c.w, c.h) / 2) c.hp = 0;
      }
      state.covers = state.covers.filter(c => c.hp > 0);
      state.enemies = state.enemies.filter(e => !e.dead);
      if (state.enemies.length === 0 && state.locked) {
        state.locked = false;
        state.exit.open = true;
        for (const t of state.sealedTiles) {
          if (t.y > 0 && t.y < MAP_H - 1 && t.x > 0 && t.x < MAP_W - 1) state.map[t.y][t.x] = 0;
        }
        refreshFloorCells();
        showBanner("房间已清空，门已打开", 1);
        saveGame();
        setTimeout(offerBoons, 350);
      }
    }

    function updateBoss(e, dt, d, toP) {
      const hpRate = e.hp / e.maxHp;
      const nextPhase = hpRate < .33 ? 3 : hpRate < .66 ? 2 : 1;
      if (nextPhase > e.phase) {
        e.phase = nextPhase;
        e.specialCd = .5;
        e.speed *= 1.08;
        spawnParticles(e.x, e.y, e.color, 36);
        showBanner(e.name + " 进入第 " + e.phase + " 阶段", 1.4);
        state.shake = .45;
      }
      e.specialCd -= dt;
      if (e.specialCd > 0) return;
      const trait = e.trait;
      const p = state.player;
      const phaseMult = e.phase === 3 ? .58 : e.phase === 2 ? .76 : 1;
      if (trait === "charge" || trait === "all") {
        const len = d || 1;
        const ang = Math.atan2(toP.y, toP.x);
        spawnWarning(e.x, e.y, 190, .48, "line", ang, () => {
          e.vx += Math.cos(ang) * 620;
          e.vy += Math.sin(ang) * 620;
        });
        e.specialCd = (trait === "all" ? 2.6 : 2.2) * phaseMult;
        state.attacks.push({ x: e.x, y: e.y, angle: Math.atan2(toP.y, toP.x), range: 92, arc: .5, life: .2, color: "#f06e4c", enemy: true });
      }
      if (trait === "arrows" || trait === "all") {
        const base = Math.atan2(toP.y, toP.x);
        spawnWarning(e.x, e.y, 210, .36, "cone", base, () => {
          const spread = e.phase === 3 ? 4 : e.phase === 2 ? 3 : 2;
          for (let i = -spread; i <= spread; i++) {
            const a = base + i * .18;
            addProjectile(e.x, e.y, Math.cos(a) * 290, Math.sin(a) * 290, e.attack, "#b497ff", true, 6, 2);
          }
        });
        e.specialCd = (trait === "all" ? 2.4 : 1.9) * phaseMult;
      }
      if (trait === "rings" || trait === "all") {
        spawnWarning(e.x, e.y, 150, .55, "circle", 0, () => {
          const count = e.phase === 3 ? 22 : e.phase === 2 ? 18 : 14;
          for (let i = 0; i < count; i++) {
            const a = i / count * Math.PI * 2 + now() * .5;
            addProjectile(e.x, e.y, Math.cos(a) * (185 + e.phase * 18), Math.sin(a) * (185 + e.phase * 18), e.attack, "#ff7d4f", true, 7, 2.4);
          }
        });
        e.specialCd = (trait === "all" ? 3.1 : 2.5) * phaseMult;
      }
      if (trait === "summon" || trait === "all") {
        for (let i = 0; i < 1 + e.phase; i++) {
          const p2 = randomFloorAway(90);
          const minion = makeEnemy(p2.x, p2.y, e.phase >= 3 ? "charger" : "crawler", 32 + state.level * 10, 112, "#744b6f");
          state.enemies.push(minion);
        }
        e.specialCd = (trait === "all" ? 4.2 : 3.5) * phaseMult;
      }
    }

    function updateProjectiles(dt) {
      const handle = (arr, enemies) => {
        for (const pr of arr) {
          pr.ttl -= dt;
          pr.x += pr.vx * dt;
          pr.y += pr.vy * dt;
          if (pr.ttl <= 0 || isSolidWorld(pr.x, pr.y)) {
            pr.dead = true;
            if (pr.splash) splash(pr.x, pr.y, pr.splash, pr.damage);
            continue;
          }
          for (const b of state.bombs) {
            if (!b.dead && Math.hypot(b.x - pr.x, b.y - pr.y) < b.r + pr.r) {
              triggerBomb(b, .12);
              pr.dead = true;
              break;
            }
          }
          if (pr.dead) continue;
          if (enemies) {
            for (const e of state.enemies) {
              if (e.dead) continue;
              if (Math.hypot(e.x - pr.x, e.y - pr.y) < e.r + pr.r) {
                damageEnemy(e, pr.damage, pr.vx * .35, pr.vy * .35);
                pr.dead = true;
                if (pr.splash) splash(pr.x, pr.y, pr.splash, pr.damage);
                break;
              }
            }
          } else if (Math.hypot(state.player.x - pr.x, state.player.y - pr.y) < state.player.r + pr.r) {
            damagePlayer(pr.damage, pr.x, pr.y);
            pr.dead = true;
          }
        }
      };
      handle(state.projectiles, true);
      handle(state.enemyProjectiles, false);
      state.projectiles = state.projectiles.filter(p => !p.dead);
      state.enemyProjectiles = state.enemyProjectiles.filter(p => !p.dead);
    }

    function updateWarnings(dt) {
      for (const w of state.warnings) {
        w.delay -= dt;
        if (w.delay <= 0 && !w.done) {
          w.done = true;
          w.fire && w.fire();
        }
      }
      state.warnings = state.warnings.filter(w => !w.done);
    }

    function splash(x, y, radius, damage) {
      spawnParticles(x, y, "#93d9ff", 18);
      for (const e of state.enemies) {
        if (!e.dead && Math.hypot(e.x - x, e.y - y) < radius + e.r) {
          const a = Math.atan2(e.y - y, e.x - x);
          damageEnemy(e, damage * .75, Math.cos(a) * 180, Math.sin(a) * 180);
        }
      }
    }

    function updateParticles(dt) {
      for (const p of state.particles) {
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= Math.pow(.08, dt);
        p.vy *= Math.pow(.08, dt);
      }
      state.particles = state.particles.filter(p => p.life > 0);
      for (const a of state.attacks) a.life -= dt;
      state.attacks = state.attacks.filter(a => a.life > 0);
      for (const d of state.drops) d.life -= dt;
      state.drops = state.drops.filter(d => d.life > 0 && !d.dead);
      for (const t of state.trails) t.life -= dt;
      state.trails = state.trails.filter(t => t.life > 0);
      for (const b of state.bombs) {
        if (b.dead || b.fuse <= 0) continue;
        b.fuse -= dt;
        if (b.fuse <= 0) explodeBomb(b);
      }
      state.bombs = state.bombs.filter(b => !b.dead);
      updateTraps(dt);
    }

    function updateTraps(dt) {
      for (const s of state.spikes) {
        s.timer += dt;
        s.active = (s.timer % s.period) > s.period * .55;
        s.hurtCd = Math.max(0, s.hurtCd - dt);
        if (!s.active || s.hurtCd > 0) continue;
        if (Math.hypot(state.player.x - s.x, state.player.y - s.y) < state.player.r + s.r) {
          damagePlayer(12 + state.level * 3, s.x, s.y);
          s.hurtCd = .55;
        }
        for (const e of state.enemies) {
          if (!e.dead && Math.hypot(e.x - s.x, e.y - s.y) < e.r + s.r) {
            damageEnemy(e, 18 + state.level * 5, 0, 0);
            s.hurtCd = .35;
          }
        }
      }
    }

    function update(dt) {
      if (state.shopOpen || state.phase !== "running") dt = Math.min(dt, .02);
      if (state.phase === "running" && !state.gameOver && !state.victory) {
        updatePlayer(dt);
        if (!state.shopOpen) {
          updateEnemies(dt);
          updateProjectiles(dt);
          updateWarnings(dt);
        }
      }
      updateParticles(dt);
      state.shake = Math.max(0, state.shake - dt);
      state.savedFlash = Math.max(0, state.savedFlash - dt);
      if (now() > state.bannerUntil) ui.banner.classList.remove("on");
      state.cam.x = clamp(state.player.x - state.w / state.scale / 2, 0, MAP_W * TILE - state.w / state.scale);
      state.cam.y = clamp(state.player.y - state.h / state.scale / 2, 0, MAP_H * TILE - state.h / state.scale);
      updateUI();
    }

    function drawPixelRect(x, y, w, h, c) {
      ctx.fillStyle = c;
      ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
    }

    function draw() {
      ctx.save();
      ctx.scale(state.scale, state.scale);
      const vw = state.w / state.scale, vh = state.h / state.scale;
      drawPixelRect(0, 0, vw, vh, "#101116");
      let sx = 0, sy = 0;
      if (state.shake > 0) {
        sx = rand(-6, 6) * state.shake * 4;
        sy = rand(-6, 6) * state.shake * 4;
      }
      ctx.translate(-Math.floor(state.cam.x) + sx, -Math.floor(state.cam.y) + sy);
      drawMap();
      drawExit();
      for (const s of state.spikes) drawSpike(s);
      for (const c of state.chests) drawChest(c);
      for (const b of state.bombs) drawBomb(b);
      for (const d of state.drops) drawDrop(d);
      for (const c of state.covers) drawCover(c);
      for (const w of state.warnings) drawWarning(w);
      for (const pr of state.projectiles) drawProjectile(pr);
      for (const pr of state.enemyProjectiles) drawProjectile(pr);
      for (const a of state.attacks) drawAttack(a);
      for (const t of state.trails) drawTrail(t);
      for (const e of state.enemies) drawEnemy(e);
      drawPlayer();
      drawAim();
      for (const p of state.particles) {
        ctx.globalAlpha = clamp(p.life * 3, 0, 1);
        drawPixelRect(p.x, p.y, p.size, p.size, p.color);
        ctx.globalAlpha = 1;
      }
      ctx.restore();
      drawMiniMap(vw, vh);
    }

    function drawMap() {
      const th = theme();
      for (let y = 0; y < MAP_H; y++) {
        for (let x = 0; x < MAP_W; x++) {
          const wx = x * TILE, wy = y * TILE;
          if (state.map[y][x] === 1) {
            drawPixelRect(wx, wy, TILE, TILE, th.wall);
            drawPixelRect(wx, wy, TILE, 5, th.wallTop);
            drawPixelRect(wx + 2, wy + 7, TILE - 4, TILE - 9, th.wall);
            if (tileAt(x, y + 1) === 0) drawPixelRect(wx, wy + TILE - 5, TILE, 5, th.trim);
            if (tileAt(x + 1, y) === 0) drawPixelRect(wx + TILE - 5, wy, 5, TILE, th.trim);
          } else {
            drawPixelRect(wx, wy, TILE, TILE, th.floor2);
            drawPixelRect(wx + 1, wy + 1, TILE - 2, TILE - 2, th.floor);
            if ((x + y) % 3 === 0) drawPixelRect(wx + 4, wy + 4, TILE - 8, 2, th.trim);
            if ((x * 7 + y * 11) % 13 === 0) drawPixelRect(wx + 20, wy + 18, 7, 5, "#302b2e");
            if ((x * 5 + y * 3) % 17 === 0) drawPixelRect(wx + 7, wy + 23, 4, 4, "#141316");
            if ((x + 2 * y) % 19 === 0) drawPixelRect(wx + 12, wy + 10, 3, 3, th.accent);
          }
        }
      }
      for (const d of state.floorDots) drawPixelRect(d.x, d.y, 3, 3, d.c);
    }

    function drawExit() {
      const e = state.exit;
      drawPixelRect(e.x, e.y, e.w, e.h, e.open ? "#5c4226" : "#211915");
      drawPixelRect(e.x + 6, e.y + 8, e.w - 12, e.h - 12, e.open ? "#14100e" : "#3b2b24");
      drawPixelRect(e.x + 16, e.y + 38, 8, 8, e.open ? "#ffd35d" : "#694434");
      if (state.locked) {
        drawPixelRect(e.x + 8, e.y + 14, e.w - 16, 8, "#7b2626");
        drawPixelRect(e.x + 8, e.y + 46, e.w - 16, 8, "#7b2626");
        drawPixelRect(e.x + 8, e.y + 70, e.w - 16, 8, "#7b2626");
      }
    }

    function drawPlayer() {
      const p = state.player;
      ctx.globalAlpha = p.hurtCd > 0 ? .65 : 1;
      const bob = p.anim === "run" ? Math.sin(now() * 18) * 2 : 0;
      const step = p.anim === "run" ? Math.sign(Math.sin(now() * 18)) : 0;
      const squash = p.anim === "attack" ? 3 : p.anim === "hurt" ? -1 : 0;
      const cape = Math.sin(now() * 8) * 2 + step * 2;
      const atkPhase = p.anim === "attack" ? Math.min(1, p.animTime / .18) : 0;
      const lean = p.anim === "run" ? step * 2 : p.anim === "attack" ? 3 : 0;
      ctx.globalAlpha = .35;
      drawPixelRect(p.x - 18, p.y + 20, 36, 8, "#050506");
      ctx.globalAlpha = p.hurtCd > 0 ? .65 : 1;
      if (p.anim === "dead") {
        drawPixelRect(p.x - 18, p.y + 4, 36, 16, "#36567d");
        drawPixelRect(p.x - 20, p.y + 2, 40, 4, "#111216");
        drawPixelRect(p.x - 24, p.y + 8, 12, 8, "#f0c48e");
        ctx.globalAlpha = 1;
        return;
      }
      ctx.globalAlpha = .32;
      drawPixelRect(p.x - 26, p.y - 6 + bob, 52, 22, "#0d0f14");
      ctx.globalAlpha = p.hurtCd > 0 ? .65 : 1;
      drawPixelRect(p.x - 20 - p.faceX * 4 + lean, p.y - 10 + bob + cape, 12, 28, "#5b2635");
      drawPixelRect(p.x + 8 - p.faceX * 4 + lean, p.y - 10 + bob - cape, 12, 28, "#7b2f3d");
      drawPixelRect(p.x - 15 - squash, p.y - 13 + bob, 30 + squash * 2, 30, "#2f5a8a");
      drawPixelRect(p.x - 12, p.y - 10 + bob, 24, 8, "#89aee0");
      drawPixelRect(p.x - 13, p.y - 1 + bob, 26, 4, "#203b5d");
      drawPixelRect(p.x - 11, p.y - 16 + bob, 22, 3, "#6d8fc0");
      drawPixelRect(p.x - 10, p.y - 22 + bob, 20, 12, "#f0c48e");
      drawPixelRect(p.x - 12, p.y - 24 + bob, 24, 6, "#5a3d2b");
      drawPixelRect(p.x - 8, p.y - 26 + bob, 16, 3, "#a86f42");
      drawPixelRect(p.x - 9, p.y - 28 + bob, 18, 4, "#c89a63");
      const blink = Math.floor(now() * 2.7) % 9 === 0;
      drawPixelRect(p.x - 7 + p.faceX * 3, p.y - 17 + p.faceY * 2, 3, blink ? 1 : 3, "#120f13");
      drawPixelRect(p.x + 4 + p.faceX * 3, p.y - 17 + p.faceY * 2, 3, blink ? 1 : 3, "#120f13");
      drawPixelRect(p.x - 15, p.y + 10 - bob + step * 2, 11, 12, "#26415f");
      drawPixelRect(p.x + 4, p.y + 10 + bob - step * 2, 11, 12, "#26415f");
      drawPixelRect(p.x - 14, p.y + 10 - bob + step * 2, 3, 12, "#7fc8ff");
      drawPixelRect(p.x + 13, p.y + 10 + bob - step * 2, 3, 12, "#7fc8ff");
      drawPixelRect(p.x - 16, p.y + 21 - bob + step * 2, 14, 3, "#1d2738");
      drawPixelRect(p.x + 2, p.y + 21 + bob - step * 2, 14, 3, "#1d2738");
      const w = weapon();
      const reach = p.anim === "attack" ? 28 : 18;
      ctx.globalAlpha = .18;
      drawPixelRect(p.x + p.faceX * (reach + 10) - 10, p.y + p.faceY * (reach + 10) - 10, 20, 20, currentGear().qualityColor || w.color);
      ctx.globalAlpha = p.hurtCd > 0 ? .65 : 1;
      if (p.anim === "attack") {
        const sx = p.x + p.faceX * (18 + atkPhase * 16);
        const sy = p.y + p.faceY * (18 + atkPhase * 16);
        ctx.globalAlpha = .55;
        drawPixelRect(sx - 10, sy - 10, 20, 20, currentGear().qualityColor || w.color);
        drawPixelRect(sx + p.faceX * 10 - 8, sy + p.faceY * 10 - 8, 16, 16, "#fff0c8");
        drawTrail({ x: p.x, y: p.y, angle: Math.atan2(p.faceY, p.faceX), life: .1, color: currentGear().qualityColor || w.color, len: 26, width: 12 });
        ctx.globalAlpha = p.hurtCd > 0 ? .65 : 1;
      }
      drawWeaponSprite(p, reach, currentGear());
      ctx.globalAlpha = 1;
    }

    function drawWeaponSprite(p, reach, g) {
      const fx = p.faceX, fy = p.faceY;
      const x = p.x + fx * reach, y = p.y + fy * reach;
      const q = g.qualityColor || g.color;
      const swing = p.anim === "attack" ? Math.sin(now() * 24) * 6 : 0;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.atan2(fy, fx));
      if (g.id === "bow") {
        ctx.globalAlpha = .25;
        drawPixelRect(-10, -16, 24, 32, q);
        ctx.globalAlpha = 1;
        drawPixelRect(-4, -14, 5, 28, "#8b5a32");
        drawPixelRect(2, -10, 3, 20, q);
        drawPixelRect(8, -2, 18, 4, "#efe1bf");
        drawPixelRect(9, -14, 2, 28, "#fff0c8");
      } else if (g.id === "staff") {
        drawPixelRect(-2, -18, 4, 34, "#6b3d24");
        drawPixelRect(5, -7, 14, 14, q);
        ctx.globalAlpha = .32;
        drawPixelRect(1, -12, 22, 22, "#8bd8ff");
        ctx.globalAlpha = 1;
      } else if (g.id === "dagger") {
        drawPixelRect(-2, -7, 18, 5, q);
        drawPixelRect(-2, 4, 18, 5, q);
        drawPixelRect(12, -10, 6, 24, "#fff0c8");
      } else if (g.id === "hammer") {
        drawPixelRect(-4, -4, 24, 8, "#6b3d24");
        drawPixelRect(14, -12, 16, 24, q);
        drawPixelRect(18, -8, 8, 16, "#fff0c8");
      } else {
        drawPixelRect(-2, -4, 28, 8, q);
        drawPixelRect(22, -7, 8, 14, "#fff2d0");
        drawPixelRect(4, -8, 4, 16, "#ffffff");
      }
      if (p.anim === "attack") {
        ctx.globalAlpha = .22;
        drawPixelRect(-8, -8 + swing / 4, 34, 16, q);
      }
      ctx.restore();
    }

    function drawTrail(t) {
      if (!t) return;
      const len = t.len || 24;
      const width = t.width || 10;
      ctx.save();
      ctx.globalAlpha = clamp((t.life || 0) * 4, 0, .5);
      ctx.translate(t.x, t.y);
      ctx.rotate(t.angle || 0);
      const g = ctx.createLinearGradient(-4, 0, len, 0);
      g.addColorStop(0, t.color || "#fff0c8");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.fillRect(-len * .2, -width / 2, len, width);
      ctx.restore();
    }

    function drawAim() {
      if (!aim.active) return;
      const d = Math.hypot(aim.dx, aim.dy);
      if (d < 8) return;
      const fx = aim.dx / d, fy = aim.dy / d;
      const p = state.player;
      ctx.save();
      ctx.globalAlpha = .72;
      ctx.strokeStyle = "#ffd27e";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + fx * 104, p.y + fy * 104);
      ctx.stroke();
      ctx.globalAlpha = .28;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 44 + Math.min(d, 120) * .25, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = .88;
      drawPixelRect(p.x + fx * 100 - 6, p.y + fy * 100 - 6, 12, 12, "#ffd27e");
      drawPixelRect(p.x + fx * 54 - 3, p.y + fy * 54 - 3, 6, 6, "#fff0c8");
      ctx.restore();
    }

    function drawEnemy(e) {
      if (e.boss) {
        drawBoss(e);
        return;
      }
      ctx.globalAlpha = e.hurtCd > 0 ? .55 : 1;
      const s = e.r * 2;
      const wobble = e.boss ? Math.sin(now() * 5) * 2 : Math.sin(now() * 10 + e.x) * 1.5;
      if (e.elite) {
        ctx.save();
        ctx.globalAlpha = .35 + Math.sin(now() * 8) * .08;
        ctx.fillStyle = "#ffce4f";
        ctx.beginPath();
        ctx.arc(e.x, e.y + wobble, e.r + 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = .32;
      drawPixelRect(e.x - e.r, e.y + e.r - 2, s, 7, "#050506");
      ctx.globalAlpha = e.hurtCd > 0 ? .55 : 1;
      drawPixelRect(e.x - e.r - 2, e.y - e.r - 1 + wobble, s + 4, s + 2, "#111014");
      drawPixelRect(e.x - e.r, e.y - e.r + wobble, s, s, e.color);
      drawPixelRect(e.x - e.r + 2, e.y - e.r + 2 + wobble, s - 4, 6, "rgba(255,255,255,.12)");
      drawEnemySprite(e, wobble);
      if (e.type === "archer") {
        drawPixelRect(e.x - e.r - 7, e.y - 4 + wobble, 6, 18, "#9e7b47");
        drawPixelRect(e.x + e.r + 1, e.y - 4 + wobble, 6, 18, "#9e7b47");
        drawPixelRect(e.x - 7, e.y - 10 + wobble, 14, 9, "#d9c2a0");
      } else if (e.type === "bomber") {
        drawPixelRect(e.x - 9, e.y - e.r - 9 + wobble, 18, 10, e.fuse > 0 ? "#ffdf5a" : "#5a3726");
        drawPixelRect(e.x - 4, e.y - e.r - 12 + wobble, 8, 4, "#ff8d4a");
      } else if (e.type === "charger") {
        drawPixelRect(e.x - e.r - 5, e.y - 4 + wobble, 7, 8, "#d9d0aa");
        drawPixelRect(e.x + e.r - 2, e.y - 4 + wobble, 7, 8, "#d9d0aa");
        drawPixelRect(e.x - 8, e.y - 9 + wobble, 16, 8, "#7f2f3d");
      } else if (e.type === "brute") {
        drawPixelRect(e.x - e.r + 2, e.y - e.r + 4 + wobble, s - 4, 8, "#49372e");
        drawPixelRect(e.x - 9, e.y - 11 + wobble, 18, 8, "#c1aa7e");
      }
      drawPixelRect(e.x - e.r + 4, e.y - e.r - 6, s - 8, 5, "#241818");
      drawPixelRect(e.x - e.r + 4, e.y - e.r - 6, (s - 8) * Math.max(0, e.hp / e.maxHp), 5, e.boss ? "#ffce4f" : "#d84b45");
      drawPixelRect(e.x - 7, e.y - 3 + wobble, 4, 4, "#130f12");
      drawPixelRect(e.x + 3, e.y - 3 + wobble, 4, 4, "#130f12");
      drawPixelRect(e.x - 10, e.y + 6 + wobble, 20, 3, "#141015");
      if (e.elite) drawPixelRect(e.x - 8, e.y - e.r - 13 + wobble, 16, 5, "#ffce4f");
      if (e.boss) {
        drawPixelRect(e.x - 26, e.y - e.r - 11 + wobble, 52, 9, "#d2a54f");
        drawPixelRect(e.x - 22, e.y + e.r - 2 + wobble, 44, 7, "#593b29");
      }
      ctx.globalAlpha = 1;
    }

    function drawEnemySprite(e, wobble) {
      const phase = (Math.sin(now() * 6 + e.x * .02) + 1) * .5;
      const jump = e.type === "charger" ? Math.sin(now() * 14 + e.y) * 2 : 0;
      const sway = Math.sin(now() * 7 + e.x * .03) * 2;
      drawPixelRect(e.x - 8, e.y - 10 + wobble, 16, 8, e.elite ? "#ffe07a" : "#1a1214");
      drawPixelRect(e.x - 10, e.y - 2 + wobble, 20, 12, e.color);
      drawPixelRect(e.x - 12, e.y + 8 + wobble + jump, 8, 12, "#241315");
      drawPixelRect(e.x + 4, e.y + 8 + wobble - jump, 8, 12, "#241315");
      drawPixelRect(e.x - 16, e.y - 2 + wobble, 6, 16, "#312129");
      drawPixelRect(e.x + 10, e.y - 2 + wobble, 6, 16, "#312129");
      drawPixelRect(e.x - 6, e.y - 8 + wobble, 4, 4, "#0e0b0d");
      drawPixelRect(e.x + 2, e.y - 8 + wobble, 4, 4, "#0e0b0d");
      if (e.type === "crawler") {
        drawPixelRect(e.x - 12, e.y - 12 + wobble, 24, 5, "#8c6b5a");
        drawPixelRect(e.x - 14, e.y - 4 + wobble, 28, 4, "#5a3f36");
      } else if (e.type === "brute") {
        drawPixelRect(e.x - 14, e.y - 16 + wobble, 28, 6, "#1e1618");
        drawPixelRect(e.x - 12, e.y - 20 + wobble, 24, 8, "#d9c2a0");
        drawPixelRect(e.x - 18, e.y - 8 + wobble, 36, 8, "#432c25");
      } else if (e.type === "archer") {
        drawPixelRect(e.x - 13, e.y - 18 + wobble, 26, 6, "#caa46f");
        drawPixelRect(e.x - 16, e.y - 6 + wobble, 6, 18, "#6b4b2d");
        drawPixelRect(e.x + 10, e.y - 6 + wobble, 6, 18, "#6b4b2d");
        drawPixelRect(e.x - 8, e.y - 14 + wobble, 16, 4, "#efe1bf");
      } else if (e.type === "bomber") {
        drawPixelRect(e.x - 10, e.y - 16 + wobble, 20, 8, "#ff8d4a");
        drawPixelRect(e.x - 4, e.y - 22 + wobble, 8, 5, "#ffd35d");
        drawPixelRect(e.x - 6, e.y - 10 + wobble, 12, 4, "#4d2519");
      } else if (e.type === "charger") {
        drawPixelRect(e.x - 16, e.y - 14 + wobble, 10, 8, "#d9d0aa");
        drawPixelRect(e.x + 6, e.y - 14 + wobble, 10, 8, "#d9d0aa");
        drawPixelRect(e.x - 18, e.y + 2 + wobble, 6, 8, "#6b3d24");
        drawPixelRect(e.x + 12, e.y + 2 + wobble, 6, 8, "#6b3d24");
        drawPixelRect(e.x - 12 + sway, e.y - 20 + wobble, 24, 4, "#2a1118");
      }
      if (e.elite) {
        drawPixelRect(e.x - 10, e.y - 28 + wobble, 20, 5, "#ffce4f");
        drawPixelRect(e.x - 16, e.y + 14 + wobble, 8, 8, phase > .5 ? "#fff0c8" : "#ffce4f");
      }
      if (e.hurtCd > 0) drawPixelRect(e.x - 6, e.y - 4 + wobble, 12, 4, "#fff0c8");
    }

    function drawBoss(e) {
      const th = theme();
      const wobble = Math.sin(now() * (4 + e.phase)) * 3;
      const aura = 54 + e.phase * 10 + Math.sin(now() * 6) * 4;
      ctx.save();
      ctx.globalAlpha = .26;
      ctx.fillStyle = e.phase >= 3 ? "#ff3b30" : th.accent;
      ctx.beginPath();
      ctx.arc(e.x, e.y + wobble, aura, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = .38;
      drawPixelRect(e.x - 44, e.y + 26, 88, 14, "#050506");
      ctx.globalAlpha = e.hurtCd > 0 ? .68 : 1;
      drawPixelRect(e.x - 34, e.y - 44 + wobble, 68, 78, "#111014");
      drawPixelRect(e.x - 30, e.y - 38 + wobble, 60, 68, e.color);
      drawPixelRect(e.x - 24, e.y - 32 + wobble, 48, 12, "rgba(255,255,255,.16)");
      drawPixelRect(e.x - 42, e.y - 18 + wobble, 16, 44, "#2a1118");
      drawPixelRect(e.x + 26, e.y - 18 + wobble, 16, 44, "#2a1118");
      drawPixelRect(e.x - 36, e.y - 54 + wobble, 72, 13, "#d2a54f");
      drawPixelRect(e.x - 25, e.y - 66 + wobble, 10, 15, "#ffd35d");
      drawPixelRect(e.x - 5, e.y - 70 + wobble, 10, 19, "#ffd35d");
      drawPixelRect(e.x + 15, e.y - 66 + wobble, 10, 15, "#ffd35d");
      drawPixelRect(e.x - 16, e.y - 18 + wobble, 9, 8, "#11090a");
      drawPixelRect(e.x + 7, e.y - 18 + wobble, 9, 8, "#11090a");
      drawPixelRect(e.x - 12, e.y + 7 + wobble, 24, 5, "#1a0f11");
      drawPixelRect(e.x - 18, e.y - 2 + wobble, 36, 18, e.phase >= 3 ? "#ffdf5a" : th.accent);
      ctx.globalAlpha = .28;
      drawPixelRect(e.x - 48, e.y - 22 + wobble, 96, 20, e.phase >= 3 ? "#ff3b30" : th.accent);
      ctx.globalAlpha = 1;
      if (e.phase >= 2) {
        drawPixelRect(e.x - 50, e.y - 8 + wobble, 12, 36, "#c44d34");
        drawPixelRect(e.x + 38, e.y - 8 + wobble, 12, 36, "#c44d34");
        drawPixelRect(e.x - 56, e.y - 20 + wobble, 18, 8, "#ffb03b");
        drawPixelRect(e.x + 38, e.y - 20 + wobble, 18, 8, "#ffb03b");
      }
      if (e.phase >= 3) {
        drawPixelRect(e.x - 58, e.y - 48 + wobble, 18, 18, "#ff3b30");
        drawPixelRect(e.x + 40, e.y - 48 + wobble, 18, 18, "#ff3b30");
        drawPixelRect(e.x - 14, e.y - 76 + wobble, 28, 8, "#ff3b30");
      }
      drawPixelRect(e.x - 34, e.y - 58 + wobble, 68, 6, "#241818");
      drawPixelRect(e.x - 34, e.y - 58 + wobble, 68 * Math.max(0, e.hp / e.maxHp), 6, "#ffce4f");
      if (e.phase >= 2) {
        drawPixelRect(e.x - 12, e.y + 10 + wobble, 24, 8, "#2b1118");
      }
      if (e.phase >= 3) {
        drawPixelRect(e.x - 20, e.y + 16 + wobble, 40, 6, "#5c2b1f");
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function drawProjectile(p) {
      drawPixelRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2, p.color);
      drawPixelRect(p.x - 2, p.y - 2, 4, 4, "#fff4c9");
    }

    function drawWarning(w) {
      const pulse = clamp(1 - w.delay / w.maxDelay, 0, 1);
      ctx.save();
      ctx.globalAlpha = .16 + pulse * .24;
      ctx.fillStyle = "#ff3b30";
      ctx.strokeStyle = "#ffb0a6";
      ctx.lineWidth = 3;
      if (w.kind === "line") {
        ctx.translate(w.x, w.y);
        ctx.rotate(w.angle);
        ctx.fillRect(0, -20, w.radius, 40);
        ctx.strokeRect(0, -20, w.radius, 40);
      } else if (w.kind === "cone") {
        ctx.translate(w.x, w.y);
        ctx.rotate(w.angle);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, w.radius, -.55, .55);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawAttack(a) {
      ctx.save();
